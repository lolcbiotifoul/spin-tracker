<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin Tracker Betclic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: fixed left rail + scrolling workspace of dense dark panels, like a grinder's desk at night */
  --bg: #0a0a0a;
  --rail: #141414;
  --panel: #171717;
  --panel2: #141414;
  --hover: #262626;
  --line: #222222;
  --text: #fafafa;
  --muted: #a3a3a3;
  --accent: #f59e0b;
  --good: #22c55e;
  --bad: #ef4444;
  --fish: #3b82f6;
  --reg: #ef4444;
  --pink: #f472b6;
  --cream: #fbf2d3;
  --display: "Inter", "Segoe UI", system-ui, sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); font-feature-settings: 'cv11', 'ss01'; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, .mono { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: 210px 1fr; height: 100%; }
/* rail */
.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 10px; gap: 4px; min-height: 0; }
.brand { font: 700 25px/1 var(--cond); letter-spacing: .01em; padding: 4px 8px 14px; display: flex; align-items: center; gap: 8px; }
.brand b { color: var(--accent); }
.brand span { white-space: nowrap; }
.brand svg { flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; color: #b3b3b3; font-size: 13.5px; text-decoration: none; font-weight: 500; }
.nav a:hover { background: #1c1c1c; color: var(--text); }
.nav a.on { background: var(--hover); color: var(--text); }
.nav svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.rail .spacer { flex: 1; }
.store-state { font-size: 12px; color: var(--muted); padding: 8px 10px; line-height: 1.35; }
.store-state i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; }
.store-state i.warn { background: var(--accent); }
/* main */
.main { overflow: auto; min-width: 0; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 14px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; text-align: center; }
.kpi .l { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font: 700 24px/1.25 var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .grow { flex: 1; }
.seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; color: #d4d4d4; font-weight: 500; font-size: 13px; }
.seg button:hover:not(.on) { color: var(--text); background: #1c1c1c; }
.seg button.on { background: var(--cream); color: #171717; font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 6px 12px; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: #3a3a3a; background: #1c1c1c; }
.btn.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); font-weight: 600; }
.btn.danger { border-color: #5a2a2c; color: #ff9a9d; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.chip.on { border-color: var(--accent); color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.panel h3 { margin: 0 0 8px; font: 600 15px/1.2 var(--body); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel h3 .help { color: var(--muted); font-weight: 400; font-size: 12px; }
.panel h3 .r { margin-left: auto; display: flex; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 12px; }
.grid2b { display: grid; grid-template-columns: 1fr 1.25fr; gap: 12px; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.tile .l { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .l .qm { width: 18px; height: 18px; font-size: 11px; }
.tile .v { font: 700 21px/1.3 var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.pos { color: var(--good); } .neg { color: var(--bad); } .mut { color: var(--muted); }
.chart-wrap { position: relative; height: max(420px, calc(100vh - 290px)); }
.chart-wrap canvas { width: 100%; height: 100%; display: block; }
.tip { position: absolute; pointer-events: none; background: #0f0f0f; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; white-space: nowrap; display: none; z-index: 5; }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.legend button { border: 1px solid var(--line); background: var(--panel2); border-radius: 7px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.legend .lg { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 0 6px 0 0; }
.legend .lg > button:first-child { border: 0; background: transparent; padding: 5px 3px 5px 9px; font-weight: 500; }
.legend { gap: 5px; }
.legend .lg.off > button:first-child { opacity: .4; }
.qm.sm { width: 16px; height: 16px; font-size: 10px; border: 0; background: transparent; color: #8a8a8a; }
.qm.sm:hover { color: var(--text); background: var(--hover); }
.lg-more { position: relative; display: inline-flex; }
.legend .lg-mbtn { gap: 8px; padding: 5px 10px; font-weight: 500; }
.lg-mbtn b { background: var(--hover); border-radius: 999px; min-width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; padding: 0 5px; }
.lg-menu { position: absolute; bottom: calc(100% + 6px); right: 0; background: #1c1c1c; border: 1px solid #2e2e2e; border-radius: 10px; padding: 5px; min-width: 270px; box-shadow: 0 12px 30px rgba(0,0,0,.55); z-index: 20; display: flex; flex-direction: column; gap: 2px; }
.lg-row { display: flex; align-items: center; gap: 4px; border-radius: 7px; padding-right: 6px; }
.lg-row:hover, .lg-row.on { background: #262626; }
.legend .lg-row > button:first-child { flex: 1; border: 0; background: transparent; padding: 7px 8px; font-size: 13px; font-weight: 500; gap: 10px; justify-content: flex-start; color: #8f8f8f;  white-space: nowrap; text-align: left; }
.lg-row.on > button:first-child { color: var(--text); }
.legend .lg-chk > button:first-child { gap: 8px; color: #8f8f8f; opacity: 1; }
.legend .lg-chk.on > button:first-child { color: var(--text); }
.lg-chk .ck { width: 15px; height: 15px; border-radius: 4px; border: 1px solid #4a4a4a; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.lg-chk.on .ck { background: #e5e5e5; border-color: #e5e5e5; }
.lg-chk.on .ck::after { content: ''; width: 7px; height: 4px; border: solid #171717; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
.legend-row { grid-template-columns: auto 1fr auto !important; }
.legend-row .legend { flex-wrap: wrap; }
.hpop { position: fixed; z-index: 90; width: 340px; background: #1f1f1f; border: 1px solid #2e2e2e; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.6); padding: 14px 16px; font-size: 13px; line-height: 1.5; color: #d4d4d4; }
.hpop h4 { margin: -14px -16px 12px; padding: 12px 16px; border-bottom: 1px solid #2e2e2e; font: 700 15px var(--body); color: var(--text); }
.hpop p { margin: 0 0 10px; } .hpop p:last-child { margin: 0; }
.hpop b { color: var(--text); }
.hd { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 1px 1px; vertical-align: middle; }
.lg-row .ck { width: 15px; height: 15px; border-radius: 4px; border: 1px solid #4a4a4a; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.lg-row.on .ck { background: #e5e5e5; border-color: #e5e5e5; }
.lg-row.on .ck::after { content: ''; width: 7px; height: 4px; border: solid #171717; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
.legend button.off { opacity: .4; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.luck { position: absolute; left: 10px; top: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; z-index: 2; }
.luck b { display: block; font-size: 13px; }
.luck.good { border-color: rgba(51,194,122,.55); background: rgba(51,194,122,.12); } .luck.good b { color: var(--good); }
.luck.bad { border-color: rgba(236,82,87,.55); background: rgba(236,82,87,.12); } .luck.bad b { color: var(--bad); }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--text); }
td { padding: 7px 8px; border-bottom: 1px solid #1f1f1f; vertical-align: middle; }
td.n, th.n { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: #1b1e22; }
tr.tot td { font-weight: 700; border-top: 1px solid var(--line); }
.scroll { overflow-x: auto; }
.sub { font-size: 11px; color: var(--muted); }
.ci { font-size: 10px; color: var(--muted); margin-left: 3px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 5px; padding: 1px 7px; }
.tag.reg { color: #ff8f93; background: rgba(236, 82, 87, .13); }
.tag.fish { color: #8dbaff; background: rgba(74, 144, 255, .14); }
.tag.unknown { color: var(--muted); background: #262626; }
.tag .man { font-weight: 400; opacity: .7; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.reg { background: var(--reg); } .dot.fish { background: var(--fish); } .dot.unknown { background: #666; }
.cards { display: inline-flex; gap: 3px; }
.card { width: 22px; height: 30px; border-radius: 4px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font: 700 13px/1 var(--display); color: #fff; }
.card small { font-size: 10px; line-height: 1; }
.c-s { background: #5b6069; } .c-h { background: #d2393f; } .c-d { background: #2f6fd6; } .c-c { background: #2a9a52; }
.card.back { background: #2a2d33; }
.acts { display: flex; gap: 14px; font-family: var(--mono); font-size: 12px; }
.acts span.st { color: var(--muted); font: 10px var(--body); display: block; }
.acts b { font-weight: 600; color: #7fb2ff; } .acts em { font-style: normal; color: #6e737b; }
.acts sub { font-size: 8px; }
.star { background: none; border: 0; color: #555; font-size: 16px; padding: 0 4px; }
.star.on { color: var(--accent); }
.pill { font-size: 11px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
.pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 13px; }
input[type=text], input[type=number], input[type=date], select { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
input[type=number] { width: 80px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; z-index: 30; width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 12px; }
.pop h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.pop .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.rel { position: relative; }
.drop { border: 2px dashed #3a3f46; border-radius: 12px; padding: 34px; text-align: center; background: var(--panel); }
.drop.over { border-color: var(--accent); background: #1d1a14; }
.drop h2 { font: 700 24px var(--display); margin: 0 0 6px; }
.progress { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow: auto; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(820px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal pre { background: #0f0f0f; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12px/1.45 var(--mono); max-height: 320px; overflow: auto; white-space: pre-wrap; }
.seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.seat { background: var(--panel2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.seat.hero { box-shadow: inset 0 0 0 1px var(--accent); }
.street { display: grid; grid-template-columns: 70px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid #262626; font-size: 13px; }
.street .nm { color: var(--muted); font-weight: 600; }
.lf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 12px; }
.lf h3 { font-size: 14px; }
.lf .head { display: flex; gap: 6px; margin-bottom: 8px; }
.lf .head div { flex: 1; background: var(--panel2); border-radius: 7px; text-align: center; padding: 6px 2px; }
.lf .head b { display: block; font: 700 19px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.lf .head span { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.lf td, .lf th { padding: 3px 6px; font-size: 12px; }
.c-ok { color: var(--good); } .c-agg { color: var(--bad); } .c-pas { color: var(--fish); } .c-na { color: #6b6b6b; }
.donuts { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
.donuts .grp { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.donuts .grp > div { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 330px; }
.donut { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.settings .panel { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner { background: #1d1a14; border: 1px solid #4a3a1d; border-radius: 10px; padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; right: 20px; bottom: 20px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; z-index: 60; }
@media (max-width: 1100px) { .grid2, .grid2b { grid-template-columns: 1fr; } .grid5 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; } .brand { padding: 4px 8px; font-size: 18px; } .rail .spacer, .store-state { display: none; }
  .kpis { grid-template-columns: repeat(2, 1fr); } .grid5 { grid-template-columns: repeat(2, 1fr); }
  .main { padding: 12px 16px 30px; } .chart-wrap { height: 340px; } .lf-grid { grid-template-columns: 1fr; }
}
/*RPCSS*/
.fm { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(980px, 100%); display: flex; flex-direction: column; max-height: calc(100vh - 60px); }
.fm-tabs { display: flex; gap: 4px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.fm-tabs button { border: 1px solid transparent; background: none; border-radius: 8px; padding: 8px 14px; font-weight: 500; color: #d6d3cc; }
.fm-tabs button.on { background: var(--panel2); border-color: #4a4f56; color: var(--text); font-weight: 600; }
.fm-tabs .fm-x { margin-left: auto; color: var(--muted); }
.fm-body { padding: 14px 20px 18px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.fm-body h4 { margin: 10px 0 2px; font-size: 13px; font-weight: 600; color: #d6d3cc; }
.fm-chip { align-self: flex-start; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--panel2); }
.fm-row6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.fm-roll { display: flex; gap: 8px; flex-wrap: wrap; }
.fm-roll .fm-card { flex: 1 1 auto; }
.fm-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fm-card { background: #1c1c1c; border: 1px solid #2a2a2a; border-radius: 9px; padding: 12px 14px; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; font-size: 14px; text-align: center; flex-wrap: wrap; min-height: 48px; }
.fm-grid2 .fm-card, .fm-tog { justify-content: flex-start; text-align: left; min-height: 54px; }
.fm-tog { align-self: flex-start; }
.fm-card .sub { width: 100%; }
.fm-card:hover { border-color: #3a3a3a; }
.fm-card.on { background: #2a2b2e; border-color: #8a8f96; box-shadow: inset 0 0 0 1px #8a8f96; font-weight: 600; }
.fm-card input[type=number] { width: 58px; text-align: center; }
.fm-card input[type=date] { margin-left: 6px; }
.fm-ic { color: var(--muted); display: inline-flex; }
.fm-foot { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); }
.btn.on-acc { border-color: var(--accent); color: var(--accent); }
.grid6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.tile .theo { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile .theo b { font-variant-numeric: tabular-nums; }
@media (max-width: 1100px) { .grid6 { grid-template-columns: repeat(3, 1fr); } .fm-row6 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px) { .grid6 { grid-template-columns: repeat(2, 1fr); } .fm-row6, .fm-grid2 { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* "?" buttons and help windows */
.qm { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); color: var(--muted); font: 700 12px/1 var(--body); display: inline-flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex: none; }
.qm:hover { color: var(--accent); border-color: var(--accent); }
.has-qm { position: relative; }
.has-qm > .qm { position: absolute; top: 10px; right: 10px; z-index: 3; }
.grid6.has-qm > .qm { top: -9px; right: -9px; }
.help-modal { width: min(640px, 100%); }
.help-list { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 10px 16px; }
.help-list dt { align-self: start; padding-top: 1px; font-weight: 600; display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.help-list dt i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.help-list dd { margin: 0; color: #d4d4d4; font-size: 13px; line-height: 1.45; }
.chart-wrap.short { height: max(340px, calc(100vh - 470px)); }
.chart-wrap.mini { height: 280px; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.stack > .panel { flex: 1; }
.grid6.g4 { grid-template-columns: repeat(4, 1fr); }
.grid6.g4 .theo { font-size: 11.5px; }

<script>
'use strict';
const E = SpinEngine;
const $ = (s, r = document) => r.querySelector(s);

const fmtE = (v, d = 0) => (v == null || !isFinite(v)) ? '—' : fmtN(v, d) + ' €';
const fmtP = (v, d = 0) => (v == null || !isFinite(v)) ? '—' : fmtN(v, d) + ' %';
const cls = (v) => v > 0 ? 'pos' : v < 0 ? 'neg' : '';
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const mean = (a) => a.length ? a.reduce((x, y) => x + y, 0) / a.length : NaN;
function ci95(a) { if (a.length < 2) return NaN; const m = mean(a); let v = 0; for (const x of a) v += (x - m) * (x - m); return 1.96 * Math.sqrt(v / (a.length - 1) / a.length); }
const DAYS = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
const SLOTS = ['00-03h', '03-06h', '06-09h', '09-12h', '12-15h', '15-18h', '18-21h', '21-00h'];
const BUCKETS = [[0, 4], [4, 6], [6, 8], [8, 10], [10, 12], [12, 14], [14, 16], [16, 18], [18, 20], [20, 1e9]];
const bucketOf = (bb) => { for (let i = 0; i < BUCKETS.length; i++) if (bb < BUCKETS[i][1]) return i; return BUCKETS.length - 1; };
const bucketName = (i) => i === BUCKETS.length - 1 ? '20+' : BUCKETS[i][0] + '-' + BUCKETS[i][1];
const POSKEYS = ['BTN', 'SB vs BTN', 'SB vs BB', 'BB vs BTN', 'BB vs SB', 'BB vs 2', 'HU SB', 'HU BB'];
const ACT_LABEL = { fold: 'Fold', limp: 'Limp', check: 'Check', call: 'Call', raise: 'Raise', shove: 'All-in' };
const AGG = { raise: 1, shove: 1 };

// ---------- state ----------
const S = {
  hands: [], byId: new Map(), players: new Map(), tours: [], hero: null,
  prefs: null, filters: defaultFilters(),
  ui: { dash: 'chips', posMode: 'hand', mtMode: 'eh', review: 'hands', rv: { pos: 'all', prof: 'all', kind: 'all', page: 0, sort: 'date', dir: -1, gid: null }, pl: { q: '', tag: 'all', sort: 'hands', dir: -1, page: 0 }, lf: { prof: 'hero', pos: 'all', ref: 'reg', sub: 'hud3', who: '', hudSrc: 'reg' }, series: { chips: { c: 1, sd: 0, nsd: 0, ev: 1 }, br: { p: 1, ev: 1, evm: 1, evp: 0, nm: 0, mk: 1 }, mu: { t: 1, m: 1, g: 1 } } },
  storage: 'memory', seedLoaded: false, imports: [], skipIds: new Set(), skipped: { other: 0, bad: [] }, rvList: []
};
// Official Betclic Spin & Rush multiplier grids (chances per 1 000 000), payouts 1st/2nd/3rd
const GRIDS = {
  std: [[2, 478185, 0], [3, 346210, 0], [4, 130000, 0], [5, 40000, 0], [10, 5000, 0], [20, 500, 1], [100, 100, 1], [1000, 5, 1]],
  hi: [[2, 479337, 0], [3, 345442, 0], [4, 130000, 0], [5, 40000, 0], [10, 5000, 0], [50, 200, 1], [500, 20, 1], [5000, 1, 1]]
};
const gridFor = (bi) => bi >= 200 ? GRIDS.hi : GRIDS.std;
const expMult = (bi) => gridFor(bi).reduce((x, g) => x + g[0] * g[1], 0) / 1e6;
const GRID_RAKE = +((1 - expMult(10) / 3) * 100).toFixed(1);
function defaultPrefs() { return { v: 2, cls: { minHands: 50, maxLimpPct: 0, maxVpip: 0, unknownAs: 'fish' }, overrides: {}, favs: {}, rakeEff: GRID_RAKE, rakeback: 0, hudRefs: {}, hudTol: 8, hudMin: 15 }; }
function migrate(p) { if (!p.v) { if (p.rakeEff === 7.8) p.rakeEff = GRID_RAKE; p.v = 2; } if (!p.hudRefs) p.hudRefs = {}; if (!p.hudTol) p.hudTol = 8; if (!p.hudMin) p.hudMin = 15; return p; }

// ---------- persistence: IndexedDB for hands, localStorage + Claude db for prefs ----------
const IDB = {
  db: null,
  open() { return new Promise(res => { try { const r = indexedDB.open('spintracker', 1); r.onupgradeneeded = () => r.result.createObjectStore('hands', { keyPath: 'i' }); r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); r.onblocked = () => res(false); } catch (e) { res(false); } }); },
  all() { return new Promise(res => { try { const q = this.db.transaction('hands').objectStore('hands').getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); } catch (e) { res([]); } }); },
  put(list) { return new Promise(res => { try { const tx = this.db.transaction('hands', 'readwrite'); const st = tx.objectStore('hands'); for (const o of list) st.put(o); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } }); },
  clear() { return new Promise(res => { try { const tx = this.db.transaction('hands', 'readwrite'); tx.objectStore('hands').clear(); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } }); }
};
const LS = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) { } } };
let cloudDoc = null, saveTimer = null;
function loadPrefs() {
  let p = defaultPrefs();
  try { const raw = LS.get('st_prefs'); if (raw) p = Object.assign(p, JSON.parse(raw)); } catch (e) { }
  p.cls = Object.assign(defaultPrefs().cls, p.cls || {}); migrate(p);
  S.prefs = p;
}
function savePrefs() {
  LS.set('st_prefs', JSON.stringify(S.prefs));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { if (cloudDoc) cloudDoc.set({ prefs: JSON.stringify(S.prefs), at: Date.now() }).catch(() => { }); }, 800);
}
async function connectCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;

    const snap = await cloudDoc.get();
    const data = snap && (typeof snap.data === 'function' ? snap.data() : snap);
    if (data && data.prefs) {
      const remote = JSON.parse(data.prefs);
      S.prefs = migrate(Object.assign(defaultPrefs(), remote, { v: remote.v })); S.prefs.cls = Object.assign(defaultPrefs().cls, remote.cls || {});

    } else savePrefs();

  } catch (e) { cloudDoc = null; }
}

// ---------- preparing hands ----------
function prep(h) {
  h.pf = E.preflopInfo(h);
  const hp = h.players.find(p => p.hero);
  h.opps = h.players.filter(p => !p.hero).map(p => p.name);
  if (hp) {
    if (h.n === 3) {
      const btn = h.players.find(p => p.pos === 'BTN'), sb = h.players.find(p => p.pos === 'SB'), bb = h.players.find(p => p.pos === 'BB');
      const first = btn && h.acts.find(a => a.st === 0 && a.p === btn.name && a.a !== 'sb' && a.a !== 'bb' && a.a !== 'ante');
      const btnFold = !first || first.a === 'f';
      if (hp.pos === 'BTN') { h.posKey = 'BTN'; h.mainOpp = null; }
      else if (hp.pos === 'SB') { h.posKey = btnFold ? 'SB vs BB' : 'SB vs BTN'; h.mainOpp = btnFold ? (bb && bb.name) : (btn && btn.name); }
      else {
        const sbFirst = sb && h.acts.find(a => a.st === 0 && a.p === sb.name && a.a !== 'sb' && a.a !== 'bb' && a.a !== 'ante');
        const sbFold = !sbFirst || sbFirst.a === 'f';
        if (btnFold) { h.posKey = 'BB vs SB'; h.mainOpp = sb && sb.name; }
        else if (sbFold) { h.posKey = 'BB vs BTN'; h.mainOpp = btn.name; }
        else { h.posKey = 'BB vs 2'; h.mainOpp = null; }
      }
    } else { h.posKey = 'HU ' + hp.pos; h.mainOpp = h.opps[0]; }
  }
  if (!h.E) h.E = { adj: false, ev: Object.assign({}, h.net), vr: {}, st: -1 };
  const tot = h.players.reduce((x, p) => x + p.stack, 0); h.cf = tot > 0 ? 1500 / tot : 1;
  return h;
}
const NET = (h, n) => (h.net[n] || 0) * h.cf, EVc = (h, n) => (h.E.ev[n] || 0) * h.cf, VRc = (h, n) => (h.E.vr[n] || 0) * h.cf * h.cf;
function isSpin(h) { const m = (h.mode || '') + ' ' + (h.gname || ''); return !m.trim() || /spin/i.test(m); }
function integrity(h) {
  let sc = 0, sw = 0;
  for (const p of h.players) { const c = h.contrib[p.name] || 0; if (c < 0 || c > p.stack + 0.5) return 'mise supérieure au tapis (' + p.name + ')'; sc += c; }
  for (const k in h.won) { if (!h.players.some(p => p.name === k)) return 'gagnant absent de la table (' + k + ')'; sw += h.won[k]; }
  if (Math.abs(sc - sw) > 0.5) return 'pot incohérent (' + fmtN(sc) + ' misés, ' + fmtN(sw) + ' gagnés)';
  for (const a of h.acts) if (!h.players.some(p => p.name === a.p)) return 'action d\'un joueur absent (' + a.p + ')';
  return null;
}
function addHands(list) {
  let added = 0;
  for (const h of list) {
    if (S.byId.has(h.id) || S.skipIds.has(h.id)) continue;
    if (!isSpin(h)) { S.skipIds.add(h.id); S.skipped.other++; continue; }
    const bad = integrity(h); if (bad) { S.skipIds.add(h.id); prep(h); S.skipped.bad.push({ h, why: bad }); continue; }
    prep(h); S.byId.set(h.id, h); S.hands.push(h); added++;
  }
  S.hands.sort((a, b) => a.ts - b.ts || (a.id < b.id ? -1 : 1));
  return added;
}

// ---------- players & classification ----------
function computePlayers() {
  const P = new Map();
  const get = (n) => { let s = P.get(n); if (!s) { s = { name: n, hands: 0, vpip: 0, pfr: 0, btnOpp: 0, btnLimp: 0, tbOpp: 0, tb: 0, last: 0, evG: new Map(), huG: new Map(), hero: false }; P.set(n, s); } return s; };
  for (const h of S.hands) {
    for (const p of h.players) {
      const s = get(p.name); s.hands++; if (h.ts > s.last) s.last = h.ts; if (p.hero) s.hero = true;
      const I = h.pf[p.name];
      if (I) { if (I.vpip) s.vpip++; if (I.pfr) s.pfr++; if (I.btnOpp) s.btnOpp++; if (I.btnLimp) s.btnLimp++; if (I.threeBetOpp) s.tbOpp++; if (I.threeBet) s.tb++; }

      s.evG.set(h.gid, (s.evG.get(h.gid) || 0) + ev);
      if (h.n === 2) s.huG.set(h.gid, (s.huG.get(h.gid) || 0) + ev);
    }
  }
  for (const s of P.values()) {
    s.auto = autoClass(s);
    const ev = [...s.evG.values()], hu = [...s.huG.values()];
    s.cev = mean(ev); s.cevCi = ci95(ev); s.cevHu = mean(hu); s.cevHuCi = ci95(hu); s.tours = ev.length; s.hus = hu.length;
  }
  S.players = P;
  const heroes = [...P.values()].filter(s => s.hero).sort((a, b) => b.hands - a.hands);
  S.hero = heroes.length ? heroes[0].name : null;
}
function autoClass(s) {
  const c = S.prefs.cls;
  const limpPct = s.btnOpp ? s.btnLimp / s.btnOpp * 100 : 0;
  if (s.btnLimp > 0 && limpPct > c.maxLimpPct) return 'fish';
  if (c.maxVpip > 0 && s.hands >= c.minHands && s.vpip / s.hands * 100 > c.maxVpip) return 'fish';
  if (s.hands >= c.minHands) return 'reg';
  return c.unknownAs;
}
function tagOf(name) { const o = S.prefs.overrides[name]; if (o) return o; const s = S.players.get(name); return s ? s.auto : 'unknown'; }

// ---------- tournaments ----------
function buildTours() {
  const G = new Map();
  for (const h of S.hands) { if (!h.hero) continue; let t = G.get(h.gid); if (!t) { t = { gid: h.gid, hands: [] }; G.set(h.gid, t); } t.hands.push(h); }
  const r = S.prefs.rakeEff / 100, rb = S.prefs.rakeback / 100;
  const tours = [];
  for (const t of G.values()) {
    const hs = t.hands; const f = hs[0], l = hs[hs.length - 1]; const hero = f.hero;
    t.bi = f.bi; t.mult = f.mult; t.prize = f.prize; t.start = f.ts; t.end = l.ts + 20000; t.hero = hero;
    t.startStack = ((f.players.find(p => p.name === hero) || {}).stack || 500) * f.cf;
    t.totalChips = 1500;
    t.full = f.players.length === 3 && f.sb === Math.min(...hs.map(h => h.sb));
    t.opps = f.players.filter(p => p.name !== hero).map(p => p.name);
    let net = 0, ev = 0, vr = 0, huNet = 0, huEv = 0, huN = 0;

    (S.tours.some(t => t.gap) ? '<p class="note">' + S.tours.filter(t => t.gap).length + ' spin(s) avec des mains manquantes dans l\'historique (tapis qui ne se suivent pas).</p>' : '') +
    '<div class="row" style="margin-top:8px"><button class="btn danger" data-act="askClear">Vider la base</button><span id="clearAsk"></span></div></div>' +
    '<div class="panel"><h3>Imports de cette session</h3>' + (S.imports.length ? '<table><thead><tr><th>Fichier</th><th class="n">Mains lues</th><th class="n">Nouvelles</th><th class="n">Spins</th></tr></thead><tbody>' + S.imports.map(i => '<tr><td>' + esc(i.name) + '</td><td class="n">' + fmtN(i.read) + '</td><td class="n">' + fmtN(i.added) + '</td><td class="n">' + fmtN(i.games) + '</td></tr>').join('') + '</tbody></table>' : '<p class="note">Aucun import pour l\'instant.' + (S.seedLoaded ? ' La base contient ton export du 11/11/2026, chargé au démarrage.' : '') + '</p>') +
    '<p class="note">Où trouver les fichiers : dans le client Betclic Poker, exporte l\'historique des mains (fichier « ExportHH_… .txt »). Importe-les régulièrement, les doublons sont ignorés.</p></div></div>';
  return h;
}
function viewSettings() {
  const c = S.prefs.cls;
  return '<div class="settings"><div class="panel"><h3>Classification Reg / Fish</h3>' +
    '<label class="f" for="sMin">Mains minimum pour être Reg<input type="number" id="sMin" min="1" value="' + c.minHands + '"></label>' +
    '<label class="f" for="sLimp">Limp au BTN (3 joueurs) toléré, en % des occasions<input type="number" id="sLimp" min="0" max="100" step="1" value="' + c.maxLimpPct + '"><span class="note">0 = un seul limp au BTN suffit pour être Fish.</span></label>' +
    '<label class="f" for="sVpip">VPIP maximum d\'un Reg (%) · 0 = ignoré<input type="number" id="sVpip" min="0" max="100" value="' + c.maxVpip + '"></label>' +
    '<label class="f" for="sUnk">Joueurs sous le seuil de mains, sans limp<select id="sUnk"><option value="fish"' + (c.unknownAs === 'fish' ? ' selected' : '') + '>Fish</option><option value="unknown"' + (c.unknownAs === 'unknown' ? ' selected' : '') + '>Inconnu (exclus des stats vs Reg / vs Fish)</option><option value="reg"' + (c.unknownAs === 'reg' ? ' selected' : '') + '>Reg</option></select></label>' +
    '<div class="row"><button class="btn primary" data-act="saveCls">Appliquer</button><span class="note">' + Object.keys(S.prefs.overrides).length + ' joueur(s) corrigé(s) à la main, ils gardent leur statut.</span></div>' +
    '<div class="row"><button class="btn" data-act="resetOv">Effacer les corrections manuelles</button></div></div>' +
    '<div class="panel"><h3>Argent</h3><label class="f" for="sRake">Rake de la grille (%)<input type="number" id="sRake" step="0.1" min="0" max="30" value="' + S.prefs.rakeEff + '"><span class="note">Sert à l\'EV profit : prize pool moyen = 3 × buy-in × (1 − rake). La grille officielle Betclic donne ' + fmtN(GRID_RAKE, 1) + ' % (multiplicateur moyen x' + fmtN(expMult(10), 2) + ').</span></label>' +
    '<label class="f" for="sRb">Rakeback (% du rake payé)<input type="number" id="sRb" step="1" min="0" max="100" value="' + S.prefs.rakeback + '"></label><div class="row"><button class="btn primary" data-act="saveMoney">Appliquer</button></div></div>' +
    '<div class="panel"><h3>Où sont gardées tes données</h3><p class="note" style="font-size:13px">Les mains sont stockées dans ce navigateur. Tes réglages, corrections de statut et favoris ' + (S.cloud ? 'sont aussi sauvegardés sur ton compte Claude et te suivent sur tes autres appareils.' : 'sont gardés dans ce navigateur.') + '</p><p class="note">Heures affichées dans le fuseau de ton appareil (' + esc(Intl.DateTimeFormat().resolvedOptions().timeZone || 'local') + ').</p></div></div>';
}

/*HUD*/
/*EXTRA*/
// ---------- render & events ----------
const VIEWS = { tableau: viewDashboard, joueurs: viewPlayers, review: viewReview, leaks: viewLeaks, imports: viewImports, reglages: viewSettings };
function currentView() { const v = (location.hash || '').slice(1); return VIEWS[v] ? v : 'tableau'; }
function render() {
  const v = currentView();
  document.querySelectorAll('#nav a, .rail .nav a').forEach(a => a.classList.toggle('on', a.dataset.v === v));
  const m = $('#main'); const sc = m.scrollTop;
  m.innerHTML = (S.seedBanner && v !== 'imports' ? '<div class="banner">Ton export Betclic du 11/11/2026 est chargé (' + fmtN(S.hands.length) + ' mains). <a href="#imports" style="color:var(--accent)">Importer d\'autres fichiers</a><button class="btn small" data-act="hideBanner" style="margin-left:auto">OK</button></div>' : '') + VIEWS[v]();
  if (v === 'tableau') afterDashboard();
  m.scrollTop = sc;
  if (v === 'imports') bindDrop();
  renderStore(); hudWarm();
}
function renderStore() { $('#storeState').innerHTML = '<i class="' + (S.storage === 'idb' ? '' : 'warn') + '"></i>' + fmtN(S.hands.length) + ' mains<br>' + (S.storage === 'idb' ? 'gardées dans ce navigateur' : 'en mémoire seulement') + (S.cloud ? '<br>réglages synchronisés' : ''); }
function refresh() { recompute(); render(); }
window.addEventListener('hashchange', () => { $('#main').scrollTop = 0; render(); });

document.addEventListener('click', (e) => {
  if (FM.draft && $('.fm')) { fmClick(e); return; }
  const fo = e.target.closest('[data-fopen]'); if (fo) { openFilters(fo.dataset.fopen); return; }
  const r = e.target.closest('[data-rp],[data-rpgo]');
  if (r) { if (r.dataset.rpgo != null) { rpStop(); RP.step = +r.dataset.rpgo; rpUpdate(); return; } if (r.dataset.rp === 'bg' && e.target !== r) return; rpCmd(r.dataset.rp); return; }
  const t = e.target.closest('[data-preset],[data-spinplay],[data-spsort],[data-spsort-preset],[data-badhand],[data-dash],[data-ser],[data-posmode],[data-mt],[data-act],[data-pltag],[data-plsort],[data-plpage],[data-rvtab],[data-rvsort],[data-rvpage],[data-hand],[data-fav],[data-gid],[data-gotogid],[data-lfsub],[data-lfwho],[data-moretoggle]');
  if (!t) return;
  const d = t.dataset, u = S.ui;
  if (d.spinplay) { e.stopPropagation(); openSpin(d.spinplay); return; }
  if (d.badhand) { const z = S.skipped.bad.find(x => x.h.id === d.badhand); if (z) openReplayer([z.h], 0, 'Main écartée : ' + z.why); return; }
  if (d.spsortPreset) { S.ui.sp = { sort: 'ev', dir: d.spsortPreset === 'worst' ? 1 : -1 }; render(); return; }
  if (d.spsort) { const sp = S.ui.sp; if (sp.sort === d.spsort) sp.dir *= -1; else { sp.sort = d.spsort; sp.dir = -1; } render(); return; }
  if (d.act === 'replayList') { openReplayer(S.rvList, 0, 'Liste Review'); return; }
  if (d.fav) { e.stopPropagation(); if (S.prefs.favs[d.fav]) delete S.prefs.favs[d.fav]; else S.prefs.favs[d.fav] = 1; savePrefs(); t.classList.toggle('on'); return; }
  if (d.act === 'closeModal') { if (e.target === t || t.tagName === 'BUTTON') $('#modalRoot').innerHTML = ''; return; }
  if (d.moretoggle) { u.moreOpen = u.moreOpen === d.moretoggle ? null : d.moretoggle; render(); return; }
  if (d.dash) { u.dash = d.dash; u.moreOpen = null; render(); }
  else if (d.ser) { const [g, k] = d.ser.split(':'); u.series[g][k] = u.series[g][k] ? 0 : 1; render(); }
  else if (d.posmode) { u.posMode = d.posmode; render(); }
  else if (d.mt) { u.mtMode = d.mt; render(); }
  else if (d.act === 'hideBanner') { S.seedBanner = false; LS.set('st_banner_off', '1'); render(); }
  else if (d.act === 'clearGid') { u.rv.gid = null; render(); }
  else if (d.act === 'copyHH') { try { navigator.clipboard.writeText($('#hhText').textContent).then(() => toast('Historique copié'), () => toast('Copie refusée par le navigateur')); } catch (er) { toast('Copie refusée par le navigateur'); } }
  else if (d.act === 'askClear') { $('#clearAsk').innerHTML = 'Sûr ? Toutes les mains seront supprimées. <button class="btn small danger" data-act="doClear">Oui, vider</button>'; }
  else if (d.act === 'doClear') { clearAll(); }
  else if (d.act === 'saveCls') { const c = S.prefs.cls; c.minHands = Math.max(1, +$('#sMin').value || 50); c.maxLimpPct = Math.max(0, +$('#sLimp').value || 0); c.maxVpip = Math.max(0, +$('#sVpip').value || 0); c.unknownAs = $('#sUnk').value; savePrefs(); refresh(); toast('Classification recalculée'); }
  else if (d.act === 'resetOv') { S.prefs.overrides = {}; savePrefs(); refresh(); toast('Corrections effacées'); }
  else if (d.act === 'saveMoney') { S.prefs.rakeEff = Math.max(0, +$('#sRake').value || 0); S.prefs.rakeback = Math.max(0, +$('#sRb').value || 0); savePrefs(); refresh(); toast('Réglages appliqués'); }
  else if (d.pltag) { u.pl.tag = d.pltag; u.pl.page = 0; render(); }
  else if (d.plsort) { if (u.pl.sort === d.plsort) u.pl.dir *= -1; else { u.pl.sort = d.plsort; u.pl.dir = d.plsort === 'name' ? 1 : -1; } render(); }
  else if (d.plpage) { u.pl.page += +d.plpage; render(); $('#main').scrollTop = 0; }
  else if (d.rvtab) { S.ui.review = d.rvtab; render(); }
  else if (d.rvsort) { if (u.rv.sort === d.rvsort) u.rv.dir *= -1; else { u.rv.sort = d.rvsort; u.rv.dir = -1; } render(); }
  else if (d.rvpage) { u.rv.page += +d.rvpage; render(); $('#main').scrollTop = 0; }
  else if (d.hand) { openHand(d.hand); }
  else if (d.gid || d.gotogid) { u.rv.gid = d.gid || d.gotogid; u.rv.page = 0; S.ui.review = 'hands'; $('#modalRoot').innerHTML = ''; if (location.hash !== '#review') location.hash = 'review'; else render(); }
  else if (d.lfsub) { u.lf.sub = d.lfsub; render(); }
  else if (d.lfwho) { u.lf.prof = 'player'; u.lf.who = d.lfwho; location.hash = 'leaks'; }
});
document.addEventListener('change', (e) => {
  if (FM.draft && /^fm/.test(e.target.id || '')) { fmReadInputs(); const keep = S.filters; S.filters = FM.draft; const r = filtered(); S.filters = keep; const n = $('.fm-foot .note'); if (n) n.textContent = fmtN(r.T.length) + ' spins correspondent'; const c = $('.fm-chip'); if (c) c.textContent = 'Date : ' + dateLabel(FM.draft); return; }
  const t = e.target, u = S.ui;
  if (t.dataset.ov !== undefined) { const n = t.dataset.ov; if (t.value) S.prefs.overrides[n] = t.value; else delete S.prefs.overrides[n]; savePrefs(); F = filtered(); render(); return; }
  if (t.id === 'rpSpeed') { RP.speed = +t.value; return; }
  if (t.id === 'rpHide') { RP.hide = t.checked; rpUpdate(); return; }
  if (t.id === 'rpChain') { RP.chain = t.checked; return; }
  if (t.id === 'rbIn') { S.prefs.rakeback = Math.max(0, Math.min(100, +t.value || 0)); savePrefs(); refresh(); return; }
  if (t.id === 'rvPos') { u.rv.pos = t.value; u.rv.page = 0; render(); }
  else if (t.id === 'rvProf') { u.rv.prof = t.value; u.rv.page = 0; render(); }
  else if (t.id === 'rvKind') { u.rv.kind = t.value; u.rv.page = 0; render(); }
  else if (t.id === 'lfProf') { u.lf.prof = t.value; render(); }
  else if (t.id === 'lfWho') { u.lf.who = t.value; render(); }
  else if (t.id === 'lfPos') { u.lf.pos = t.value; render(); }
  else if (t.id === 'lfRef') { u.lf.ref = t.value; render(); }
  else if (t.id === 'fileIn' || t.id === 'dirIn') { importFiles([...t.files], t.id === 'dirIn'); t.value = ''; }
});
let qTimer = null;
document.addEventListener('input', (e) => { if (e.target.id === 'rpSlider') { rpStop(); RP.step = +e.target.value; rpUpdate(); return; } if (e.target.id === 'plq') { clearTimeout(qTimer); const v = e.target.value; qTimer = setTimeout(() => { S.ui.pl.q = v; S.ui.pl.page = 0; render(); const i = $('#plq'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 250); } });
document.addEventListener('keydown', (e) => {
  if (FM.draft && (e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('fm-card')) { e.preventDefault(); e.target.click(); return; }
  if (RP.h && $('#rpFelt')) {
    if (e.target.tagName === 'INPUT' && e.target.type !== 'range' && e.target.type !== 'checkbox') return;
    const k = e.key, m = { ArrowRight: 'fwd', ArrowLeft: 'back', ' ': 'play', ArrowDown: 'nextHand', PageDown: 'nextHand', ArrowUp: 'prevHand', PageUp: 'prevHand', Home: 'first', End: 'last', Escape: 'close' }[k];
    if (m) { e.preventDefault(); rpCmd(m); return; }
  }
  if (e.key === 'Escape') { FM.draft = null; $('#modalRoot').innerHTML = ''; } });
function bindDrop() {
  const d = $('#drop'); if (!d) return;
  d.ondragover = (e) => { e.preventDefault(); d.classList.add('over'); };
  d.ondragleave = () => d.classList.remove('over');
  d.ondrop = async (e) => {
    e.preventDefault(); d.classList.remove('over');
    const items = [...(e.dataTransfer.items || [])].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
    if (!items.length) { importFiles([...e.dataTransfer.files]); return; }
    const files = []; const folder = items.some(x => x.isDirectory);
    const msg = $('#impMsg'), prog = $('#impProg'); if (prog) prog.style.display = 'block'; if (msg) msg.textContent = 'Lecture du dossier…';
    await Promise.all(items.map(x => walkEntry(x, files)));
    importFiles(files, folder);
  };
}
function walkEntry(entry, out) {
  return new Promise(res => {
    if (entry.isFile) { entry.file(f => { out.push(f); res(); }, () => res()); return; }
    if (!entry.isDirectory) return res();
    const reader = entry.createReader(); const subs = [];
    const next = () => reader.readEntries(async (batch) => {
      if (!batch.length) { await Promise.all(subs.map(x => walkEntry(x, out))); res(); return; }
      subs.push(...batch); next();
    }, () => res());
    next();
  });
}
const fileKey = (f) => (f.webkitRelativePath || f.name) + '|' + f.size + '|' + f.lastModified;
function seenFiles() { try { return JSON.parse(LS.get('st_files') || '{}'); } catch (e) { return {}; } }
async function importFiles(files, folder) {
  files = files.filter(f => /\.txt$/i.test(f.name) || f.type === 'text/plain'); if (!files.length) { toast(folder ? 'Aucun fichier .txt dans ce dossier' : 'Choisis des fichiers .txt'); return; }
  const seen = seenFiles(); const total = files.length;
  if (S.storage === 'idb') files = files.filter(f => !seen[fileKey(f)]);
  const skippedSeen = total - files.length; let empty = 0, newHands = 0;
  if (!files.length) { toast('Rien de nouveau : les ' + total + ' fichiers sont déjà importés'); return; }
  const prog = $('#impProg'), bar = $('#impBar'), msg = $('#impMsg');
  if (prog) prog.style.display = 'block';
  const setP = (p, m) => { if (bar) bar.style.width = (p * 100).toFixed(1) + '%'; if (msg) msg.textContent = m; };
  for (let fi = 0; fi < files.length; fi++) {
    const f = files[fi]; const tag = files.length > 1 ? 'Fichier ' + (fi + 1) + ' / ' + files.length + ' · ' : ''; setP(fi / files.length, tag + 'lecture de ' + f.name + '…'); await sleep(0);
    let text = ''; try { text = await f.text(); } catch (er) { toast('Impossible de lire ' + f.name); continue; }
    const parsed = E.parseFile(text);
    const fresh = parsed.filter(h => !S.byId.has(h.id));
    if (!parsed.length) { empty++; seen[fileKey(f)] = 1; LS.set('st_files', JSON.stringify(seen)); if (!folder) { S.imports.push({ name: f.name, read: 0, added: 0, games: 0 }); toast(f.name + ' : aucune main Betclic reconnue'); } continue; }
    for (let i = 0; i < fresh.length; i++) {
      fresh[i].E = E.computeEV(fresh[i], 10000);
      if (i % 40 === 0) { setP((fi + i / fresh.length) / files.length, tag + f.name + ' : calcul des EV ' + i + ' / ' + fresh.length); await sleep(0); }
    }
    if (S.storage === 'idb' && fresh.length) await IDB.put(fresh.map(E.pack));
    const added = addHands(fresh); newHands += added;
    seen[fileKey(f)] = 1; LS.set('st_files', JSON.stringify(seen));
    S.imports.push({ name: f.webkitRelativePath || f.name, read: parsed.length, added, games: new Set(parsed.map(h => h.gid)).size });
  }
  setP(1, 'Terminé');
  S.seedBanner = false; refresh();
  toast('Import terminé : ' + fmtN(newHands) + ' nouvelles mains' + (skippedSeen ? ' · ' + skippedSeen + ' fichier(s) déjà lus' : '') + (empty ? ' · ' + empty + ' fichier(s) sans main Betclic' : ''));
}
async function clearAll() {
  if (S.storage === 'idb') await IDB.clear();
  LS.set('st_seed_off', '1'); LS.set('st_files', '{}');
  S.hands = []; S.byId = new Map(); S.seedLoaded = false; S.seedBanner = false; refresh(); toast('Base vidée');
}

/*REPLAYER*/
// ---------- boot ----------
(async function boot() {
  loadPrefs();
  $('#main').innerHTML = '<div class="panel empty">Chargement de tes mains…</div>';
  const ok = await IDB.open(); S.storage = ok ? 'idb' : 'memory';
  let stored = ok ? await IDB.all() : [];
  if (stored.length) addHands(stored.map(o => { try { return E.unpack(o); } catch (e) { return null; } }).filter(Boolean));
  else if (LS.get('st_seed_off') !== '1') {
    try {
      const r = await fetch('data/seed.json');
      if (r.ok) { const seed = await r.json(); addHands(seed.map(E.unpack)); S.seedLoaded = true; S.seedBanner = LS.get('st_banner_off') !== '1'; if (ok) IDB.put(seed); }
    } catch (e) { }
  }
  recompute();
  if (!S.hands.length && !location.hash) location.hash = 'imports';
  render();
  connectCloud();
})();

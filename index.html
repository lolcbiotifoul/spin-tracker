<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: fixed left rail + scrolling workspace of dense dark panels, like a grinder's desk at night */
  --bg: #0a0a0a;
  --rail: #141414;
  --panel: #171717;
  --panel2: #141414;
  --hover: #262626;
  --line: #222222;
  --text: #fafafa;
  --muted: #a3a3a3;
  --accent: #f59e0b;
  --good: #22c55e;
  --bad: #ef4444;
  --fish: #3b82f6;
  --reg: #ef4444;
  --pink: #f472b6;
  --cream: #fbf2d3;
  --display: "Inter", "Segoe UI", system-ui, sans-serif;
  --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--body); font-feature-settings: 'cv11', 'ss01'; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, .mono { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: 210px 1fr; height: 100%; }
/* rail */
.rail { background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 10px; gap: 4px; min-height: 0; }
.brand { font: 700 25px/1 var(--cond); letter-spacing: .01em; padding: 4px 8px 14px; display: flex; align-items: center; gap: 8px; }
.brand b { color: var(--accent); }
.brand span { white-space: nowrap; }
.brand svg { flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; color: #b3b3b3; font-size: 13.5px; text-decoration: none; font-weight: 500; }
.nav a:hover { background: #1c1c1c; color: var(--text); }
.nav a.on { background: var(--hover); color: var(--text); }
.nav svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.rail .spacer { flex: 1; }
.sync-btn { margin: 0 4px 2px; justify-content: center; }
.sync-btn:disabled { opacity: .6; cursor: progress; }
.sync-state { font-size: 11px; color: var(--muted); padding: 2px 10px 10px; text-align: center; }
@media (max-width: 760px) { .sync-state { display: none; } .sync-btn { margin: 0; white-space: nowrap; } }
.store-state { font-size: 12px; color: var(--muted); padding: 8px 10px; line-height: 1.35; }
.store-state i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; }
.store-state i.warn { background: var(--accent); }
/* main */
.main { overflow: auto; min-width: 0; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 14px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; text-align: center; }
.kpi .l { font-size: 11px; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font: 700 24px/1.25 var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .grow { flex: 1; }
.seg { display: inline-flex; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; color: #d4d4d4; font-weight: 500; font-size: 13px; }
.seg button:hover:not(.on) { color: var(--text); background: #1c1c1c; }
.seg button.on { background: var(--cream); color: #171717; font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 6px 12px; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: #3a3a3a; background: #1c1c1c; }
.btn.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); font-weight: 600; }
.btn.danger { border-color: #5a2a2c; color: #ff9a9d; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.chip.on { border-color: var(--accent); color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.panel h3 { margin: 0 0 8px; font: 600 15px/1.2 var(--body); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel h3 .help { color: var(--muted); font-weight: 400; font-size: 12px; }
.panel h3 .r { margin-left: auto; display: flex; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 12px; }
.grid2b { display: grid; grid-template-columns: 1fr 1.25fr; gap: 12px; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.tile .l { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .l .qm { width: 18px; height: 18px; font-size: 11px; }
.tile .v { font: 700 21px/1.3 var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.pos { color: var(--good); } .neg { color: var(--bad); } .mut { color: var(--muted); }
.chart-wrap { position: relative; height: max(420px, calc(100vh - 290px)); }
.chart-wrap canvas { width: 100%; height: 100%; display: block; }
.tip { position: absolute; pointer-events: none; background: #0f0f0f; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; white-space: nowrap; display: none; z-index: 5; }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.legend button { border: 1px solid var(--line); background: var(--panel2); border-radius: 7px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.legend .lg { display: inline-flex; align-items: center; gap: 2px; border: 1px solid var(--line); background: var(--panel2); border-radius: 8px; padding: 0 6px 0 0; }
.legend .lg > button:first-child { border: 0; background: transparent; padding: 5px 3px 5px 9px; font-weight: 500; }
.legend { gap: 5px; }
.legend .lg.off > button:first-child { opacity: .4; }
.qm.sm { width: 16px; height: 16px; font-size: 10px; border: 0; background: transparent; color: #8a8a8a; }
.qm.sm:hover { color: var(--text); background: var(--hover); }
.lg-more { position: relative; display: inline-flex; }
.legend .lg-mbtn { gap: 8px; padding: 5px 10px; font-weight: 500; }
.lg-mbtn b { background: var(--hover); border-radius: 999px; min-width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; padding: 0 5px; }
.lg-menu { position: absolute; bottom: calc(100% + 6px); right: 0; background: #1c1c1c; border: 1px solid #2e2e2e; border-radius: 10px; padding: 5px; min-width: 270px; box-shadow: 0 12px 30px rgba(0,0,0,.55); z-index: 20; display: flex; flex-direction: column; gap: 2px; }
.lg-row { display: flex; align-items: center; gap: 4px; border-radius: 7px; padding-right: 6px; }
.lg-row:hover, .lg-row.on { background: #262626; }
.legend .lg-row > button:first-child { flex: 1; border: 0; background: transparent; padding: 7px 8px; font-size: 13px; font-weight: 500; gap: 10px; justify-content: flex-start; color: #8f8f8f;  white-space: nowrap; text-align: left; }
.lg-row.on > button:first-child { color: var(--text); }
.legend .lg-chk > button:first-child { gap: 8px; color: #8f8f8f; opacity: 1; }
.legend .lg-chk.on > button:first-child { color: var(--text); }
.lg-chk .ck { width: 15px; height: 15px; border-radius: 4px; border: 1px solid #4a4a4a; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.lg-chk.on .ck { background: #e5e5e5; border-color: #e5e5e5; }
.lg-chk.on .ck::after { content: ''; width: 7px; height: 4px; border: solid #171717; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
.legend-row { grid-template-columns: auto 1fr auto !important; }
.legend-row .legend { flex-wrap: wrap; }
.hpop { position: fixed; z-index: 90; width: 340px; background: #1f1f1f; border: 1px solid #2e2e2e; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.6); padding: 14px 16px; font-size: 13px; line-height: 1.5; color: #d4d4d4; }
.hpop h4 { margin: -14px -16px 12px; padding: 12px 16px; border-bottom: 1px solid #2e2e2e; font: 700 15px var(--body); color: var(--text); }
.hpop p { margin: 0 0 10px; } .hpop p:last-child { margin: 0; }
.hpop b { color: var(--text); }
.hd { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin: 0 4px 1px 1px; vertical-align: middle; }
.lg-row .ck { width: 15px; height: 15px; border-radius: 4px; border: 1px solid #4a4a4a; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.lg-row.on .ck { background: #e5e5e5; border-color: #e5e5e5; }
.lg-row.on .ck::after { content: ''; width: 7px; height: 4px; border: solid #171717; border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
.legend button.off { opacity: .4; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.luck { position: absolute; left: 10px; top: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; z-index: 2; }
.luck b { display: block; font-size: 13px; }
.luck.good { border-color: rgba(51,194,122,.55); background: rgba(51,194,122,.12); } .luck.good b { color: var(--good); }
.luck.bad { border-color: rgba(236,82,87,.55); background: rgba(236,82,87,.12); } .luck.bad b { color: var(--bad); }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--text); }
td { padding: 7px 8px; border-bottom: 1px solid #1f1f1f; vertical-align: middle; }
td.n, th.n { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: #1b1e22; }
tr.tot td { font-weight: 700; border-top: 1px solid var(--line); }
.scroll { overflow-x: auto; }
.sub { font-size: 11px; color: var(--muted); }
.ci { font-size: 10px; color: var(--muted); margin-left: 3px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 5px; padding: 1px 7px; }
.tag.reg { color: #ff8f93; background: rgba(236, 82, 87, .13); }
.tag.fish { color: #8dbaff; background: rgba(74, 144, 255, .14); }
.tag.unknown { color: var(--muted); background: #262626; }
.tag .man { font-weight: 400; opacity: .7; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.reg { background: var(--reg); } .dot.fish { background: var(--fish); } .dot.unknown { background: #666; }
.cards { display: inline-flex; gap: 3px; }
.card { width: 22px; height: 30px; border-radius: 4px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font: 700 13px/1 var(--display); color: #fff; }
.card small { font-size: 10px; line-height: 1; }
.c-s { background: #5b6069; } .c-h { background: #d2393f; } .c-d { background: #2f6fd6; } .c-c { background: #2a9a52; }
.card.back { background: #2a2d33; }
.acts { display: flex; gap: 14px; font-family: var(--mono); font-size: 12px; }
.acts span.st { color: var(--muted); font: 10px var(--body); display: block; }
.acts b { font-weight: 600; color: #7fb2ff; } .acts em { font-style: normal; color: #6e737b; }
.acts sub { font-size: 8px; }
.star { background: none; border: 0; color: #555; font-size: 16px; padding: 0 4px; }
.star.on { color: var(--accent); }
.pill { font-size: 11px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
.pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 13px; }
input[type=text], input[type=number], input[type=date], select { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
input[type=number] { width: 80px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; z-index: 30; width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 12px; }
.pop h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.pop .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.rel { position: relative; }
.drop { border: 2px dashed #3a3f46; border-radius: 12px; padding: 34px; text-align: center; background: var(--panel); }
.drop.over { border-color: var(--accent); background: #1d1a14; }
.drop h2 { font: 700 24px var(--display); margin: 0 0 6px; }
.progress { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow: auto; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(820px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal pre { background: #0f0f0f; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12px/1.45 var(--mono); max-height: 320px; overflow: auto; white-space: pre-wrap; }
.seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.seat { background: var(--panel2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.seat.hero { box-shadow: inset 0 0 0 1px var(--accent); }
.street { display: grid; grid-template-columns: 70px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid #262626; font-size: 13px; }
.street .nm { color: var(--muted); font-weight: 600; }
.lf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 12px; }
.lf h3 { font-size: 14px; }
.lf .head { display: flex; gap: 6px; margin-bottom: 8px; }
.lf .head div { flex: 1; background: var(--panel2); border-radius: 7px; text-align: center; padding: 6px 2px; }
.lf .head b { display: block; font: 700 19px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.lf .head span { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.lf td, .lf th { padding: 3px 6px; font-size: 12px; }
.c-ok { color: var(--good); } .c-agg { color: var(--bad); } .c-pas { color: var(--fish); } .c-na { color: #6b6b6b; }
.donuts { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
.donuts .grp { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.donuts .grp > div { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 330px; }
.donut { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.settings .panel { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner { background: #1d1a14; border: 1px solid #4a3a1d; border-radius: 10px; padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; right: 20px; bottom: 20px; background: #262626; border: 1px solid #3a3a3a; border-left: 3px solid var(--accent); border-radius: 9px; padding: 12px 16px; z-index: 95; font-weight: 500; box-shadow: 0 10px 30px rgba(0,0,0,.5); max-width: 440px; }
@media (max-width: 1100px) { .grid2, .grid2b { grid-template-columns: 1fr; } .grid5 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; } .brand { padding: 4px 8px; font-size: 18px; } .rail .spacer, .store-state { display: none; }
  .kpis { grid-template-columns: repeat(2, 1fr); } .grid5 { grid-template-columns: repeat(2, 1fr); }
  .main { padding: 12px 16px 30px; } .chart-wrap { height: 340px; } .lf-grid { grid-template-columns: 1fr; }
}
/* replayer */
.rp-bg { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 18px; }
.rp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(1320px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; overflow: auto; }
.rp-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.rp-title { font: 700 21px/1.2 var(--display); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rp-nav { display: flex; gap: 8px; align-items: center; }
.rp-body { display: grid; grid-template-columns: 1fr 320px; gap: 14px; min-height: 0; }
.rp-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.felt { position: relative; aspect-ratio: 16 / 9.2; width: 100%; max-height: calc(100vh - 260px); margin: 0 auto; }
.felt-in { position: absolute; inset: 9% 7%; border-radius: 999px; background: radial-gradient(ellipse at 50% 45%, #22654c 0%, #164735 55%, #0f3326 100%); border: 12px solid #2b1f15; box-shadow: inset 0 0 40px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.5); }
.rp-pot { position: absolute; left: 50%; top: 35%; transform: translate(-50%,-50%); font: 700 18px var(--display); color: #f3e7c8; background: rgba(0,0,0,.35); border-radius: 999px; padding: 2px 14px; white-space: nowrap; }
.rp-board { position: absolute; left: 50%; top: 49%; transform: translate(-50%,-50%); display: flex; gap: 6px; }
.rp-note { position: absolute; left: 50%; top: 61%; transform: translateX(-50%); font-size: 13px; color: #d4d4d4; background: #0c0d0f; border: 1px solid var(--line); border-radius: 999px; padding: 3px 14px; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.card.big { width: 40px; height: 56px; font-size: 20px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.card.big small { font-size: 14px; }
.card.big.back { background: repeating-linear-gradient(45deg, #3a2f6b 0 6px, #2c2454 6px 12px); border: 2px solid #ddd; }
.card.slot { background: rgba(255,255,255,.05); box-shadow: none; border: 1px dashed rgba(255,255,255,.15); }
.rp-seat { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; width: 190px; transition: opacity .2s; }
.rp-seat.folded { opacity: .38; }
.rp-cards { display: flex; gap: 3px; margin-bottom: -14px; z-index: 1; }
.rp-box { background: #101113; border: 1px solid #353a41; border-radius: 10px; padding: 6px 10px 5px; width: 100%; text-align: center; z-index: 2; }
.rp-seat.hero .rp-box { border-color: #7a5a22; }
.rp-seat.active .rp-box { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(242,169,59,.35), 0 0 18px rgba(242,169,59,.35); }
.rp-seat.winner .rp-box { border-color: var(--good); box-shadow: 0 0 16px rgba(51,194,122,.35); }
.rp-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-stack { font: 700 17px var(--display); font-variant-numeric: tabular-nums; display: flex; justify-content: center; gap: 8px; align-items: center; }
.rp-eq { font: 600 12px var(--body); color: #111; background: var(--accent); border-radius: 4px; padding: 0 5px; }
.rp-act { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; background: #2a2e34; color: #e8e5de; white-space: nowrap; }

<script>
// ===== Spin Tracker engine: Betclic parser, pots, evaluator, all-in EV =====
(function (G) {
  'use strict';
  const RANKS = '23456789TJQKA', SUITS = 'cdhs';
  function cardId(s) { return RANKS.indexOf(s[0]) * 4 + SUITS.indexOf(s[1]); }

  // ---------- Parser ----------
  const VERBS = 'Posts SB|Posts BB|Folds|Checks|Calls|Bets|Raises to|Sits out|Sits in|Reconnected|Disconnected|Posts ante';
  const RE_ACT = new RegExp('^(\\d\\d):(\\d\\d):(\\d\\d) - (.+): (' + VERBS + ')(?: (\\d+))?( and is all-in)?\\s*$');
  const RE_SEAT = /^Seat (\d+): (.+) \((\d+)\) \[([^\]]*)\]\s*$/;
  const RE_HOLE = /^(.+): \[(\w\w) (\w\w)\]\s*$/;
  const RE_WIN = /^(.+) wins (?:main pot|\d+\w\w side pot) of (\d+)\s*$/;
  const RE_FIN = /^(.+) finished (\d+)\w\w(?: and wins ([\d.,]+) EUR)?\s*$/;
  const RE_SHOW = /^(.+) shows \[(\w\w) (\w\w)\]/;
  const STREETS = { 'PRE-FLOP': 0, 'FLOP': 1, 'TURN': 2, 'RIVER': 3, 'SHOWDOWN': 4, 'SUMMARY': 5, 'HEADER': -3, 'PLAYERS': -2, 'HOLE CARDS': -1 };
  const num = (s) => parseFloat(String(s).replace(',', '.').replace(/[^\d.\-]/g, '')) || 0;

  function parseHand(block) {
    const lines = block.split(/\r?\n/);
    const h = { players: [], acts: [], board: [], hole: {}, won: {}, fin: [], shown: {} };
    let sec = null;
    for (let raw of lines) {
      const line = raw.replace(/\s+$/, '');
      if (!line) continue;
      const m0 = /^\*\*\* ([A-Z\- ]+) \*\*\*(?: \[([^\]]*)\])?/.exec(line);
      if (m0) {
        sec = STREETS[m0[1]] !== undefined ? STREETS[m0[1]] : sec;
        if (m0[2] && (sec === 1 || sec === 2 || sec === 3)) h.board = m0[2].trim().split(/\s+/);
        continue;
      }
      if (sec === -3) {
        const i = line.indexOf(': ');
        if (i < 0) continue;
        const k = line.slice(0, i), v = line.slice(i + 2);
        switch (k) {
          case 'Site': h.site = v; break;
          case 'Game Mode': h.mode = v; break;
          case 'Game Name': h.gname = v; break;
          case 'Game ID': h.gid = v; break;
          case 'Prize pool': h.prize = num(v); break;
          case 'Multiplier': h.mult = num(v); break;
          case 'Buy In': h.bi = num(v); break;
          case 'Hand ID': h.id = v; break;
          case 'Date & Time': {
            const m = /(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d):(\d\d)/.exec(v);
            if (m) h.ts = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
            break;
          }
          case 'Table ID': h.tid = v; break;
          case 'Blinds': { const p = v.split('/'); h.sb = num(p[0]); h.bb = num(p[1]); break; }
          case 'Total Pot': h.pot = num(v); break;
          case 'Rake': h.rake = num(v); break;
        }
      } else if (sec === -2) {
        const m = RE_SEAT.exec(line);
        if (m) {
          const tags = m[4].split(/\s+/);
          h.players.push({ seat: +m[1], name: m[2], stack: +m[3], btn: tags.includes('BTN'), sbp: tags.includes('SB'), bbp: tags.includes('BB'), hero: tags.includes('Hero') });
        }
      } else if (sec === -1) {
        const m = RE_HOLE.exec(line);
        if (m) h.hole[m[1]] = [m[2], m[3]];
      } else if (sec >= 0 && sec <= 3) {
        const m = RE_ACT.exec(line);
        if (m) {
          const v = m[5];
          let a = null;
          if (v === 'Posts SB') a = 'sb'; else if (v === 'Posts BB') a = 'bb'; else if (v === 'Posts ante') a = 'ante';
          else if (v === 'Folds') a = 'f'; else if (v === 'Checks') a = 'x'; else if (v === 'Calls') a = 'c';
          else if (v === 'Bets') a = 'b'; else if (v === 'Raises to') a = 'r';

  };

// ---------- "Évènements marquants" on the bankroll curve ----------
function brEvents(P, C) {
  const n = P.length; if (n < 20) return null;
  const bi = C.reduce((x, t) => x + t.bi, 0) / n, pts = [], lines = [];
  let hi = 0, lo = 0; for (let i = 0; i < n; i++) { if (P[i] > P[hi]) hi = i; if (P[i] < P[lo]) lo = i; }
  pts.push({ i: hi, v: P[hi], label: 'Plus haut ' + fmtS(P[hi], 0) + ' €', up: 1 });
  pts.push({ i: lo, v: P[lo], label: 'Plus bas ' + fmtS(P[lo], 0) + ' €' });
  // downswings of 20 buy-ins or more: biggest drop, then the biggest ones before its peak and after its trough
  const dd = [];
  (function rec(a, b) {
    if (b - a < 2 || dd.length >= 4) return;
    let pk = a, best = 0, bp = -1, bt = -1;
    for (let i = a; i <= b; i++) { if (P[i] > P[pk]) pk = i; if (P[pk] - P[i] > best) { best = P[pk] - P[i]; bp = pk; bt = i; } }
    if (best < 20 * bi) return; dd.push([bp, bt, best]); rec(a, bp); rec(bt, b);
  })(0, n - 1);
  for (const [p, t, d] of dd) { lines.push({ i1: p, v1: P[p], i2: t, v2: P[t] }); const lab = 'Downswing −' + fmtN(d / bi, 0) + ' BI (−' + fmtN(d, 0) + ' €)'; if (t !== lo) pts.push({ i: t, v: P[t], label: lab }); else pts[1].label = lab + ' · plus bas ' + fmtS(P[lo], 0) + ' €'; }
  // longest stretches without making money (end no higher than the start)
  const minLen = Math.max(40, Math.round(n * 0.12)), be = [];
  (function rec(a, b) {
    if (b - a < minLen || be.length >= 3) return;
    const ix = []; let bi0 = -1, bj = -1;
    for (let j = a; j <= b; j++) {
      if (!ix.length || P[j] > P[ix[ix.length - 1]]) ix.push(j);
      let l = 0, h = ix.length - 1; while (l < h) { const m = (l + h) >> 1; if (P[ix[m]] >= P[j]) h = m; else l = m + 1; }
      if (j - ix[l] > bj - bi0) { bi0 = ix[l]; bj = j; }
    }
    if (bj - bi0 < minLen) return; be.push([bi0, bj]); rec(a, bi0); rec(bj, b);
  })(0, n - 1);
  for (const [i, j] of be) lines.push({ i1: i, v1: P[i], i2: j, v2: P[i], label: fmtN(j - i) + ' spins breakeven' });
  // biggest jackpots won
  C.map((t, i) => ({ t, i })).filter(x => x.t.place === 1 && x.t.mult >= 10).sort((a, b) => b.t.mult - a.t.mult || b.t.eur - a.t.eur).slice(0, 3)
    .forEach(x => pts.push({ i: x.i, v: P[x.i], label: 'Jackpot x' + fmtN(x.t.mult) + ' (+' + fmtN(x.t.eur, 0) + ' €)', up: 1 }));
  return { pts, lines };
}

  const ok = await IDB.open(); S.storage = ok ? 'idb' : 'memory';
  let stored = ok ? await IDB.all() : [];
  if (stored.length) addHands(stored.map(o => { try { return E.unpack(o); } catch (e) { return null; } }).filter(Boolean));
  recompute();
  if (!S.hands.length && !location.hash) location.hash = 'imports';
  render();
  pwaInit();
})();
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spin Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d0e10">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: fixed left rail + scrolling workspace of dense dark panels, like a grinder's desk at night */
  --bg: #0d0e10;
  --panel: #16181b;
  --panel2: #1e2125;
  --line: #2b2f35;
  --text: #ece8df;
  --muted: #8d9198;
  --accent: #f2a93b;
  --good: #33c27a;
  --bad: #ec5257;
  --fish: #4a90ff;
  --reg: #ec5257;
  --pink: #e861ae;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.4 var(--body); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num, td.n, .mono { font-variant-numeric: tabular-nums; }
.app { display: grid; grid-template-columns: 210px 1fr; height: 100%; }
/* rail */
.rail { background: #0a0b0c; border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 10px; gap: 4px; min-height: 0; }
.brand { font: 700 24px/1 var(--display); letter-spacing: .01em; padding: 4px 8px 14px; display: flex; align-items: center; gap: 8px; }
.brand b { color: var(--accent); }
.brand svg { flex: none; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 7px; color: #c9c6bf; text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--panel); }
.nav a.on { background: var(--panel2); color: var(--text); box-shadow: inset 2px 0 0 var(--accent); }
.nav svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.rail .spacer { flex: 1; }
.sync-btn { margin: 0 4px 2px; justify-content: center; }
.sync-btn:disabled { opacity: .6; cursor: progress; }
.sync-state { font-size: 11px; color: var(--muted); padding: 2px 10px 10px; text-align: center; }
@media (max-width: 760px) { .sync-state { display: none; } .sync-btn { margin: 0; white-space: nowrap; } }
.store-state { font-size: 12px; color: var(--muted); padding: 8px 10px; line-height: 1.35; }
.store-state i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; }
.store-state i.warn { background: var(--accent); }
/* main */
.main { overflow: auto; min-width: 0; padding: 18px 20px 40px; display: flex; flex-direction: column; gap: 14px; }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; text-align: center; }
.kpi .l { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kpi .v { font: 700 26px/1.15 var(--display); font-variant-numeric: tabular-nums; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar .grow { flex: 1; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 6px; color: #cfccc5; font-weight: 500; font-size: 13px; }
.seg button.on { background: var(--text); color: #111; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: #444a52; }
.btn.primary { background: var(--accent); color: #1a1205; border-color: var(--accent); font-weight: 600; }
.btn.danger { border-color: #5a2a2c; color: #ff9a9d; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
.chip.on { border-color: var(--accent); color: var(--accent); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.panel h3 { margin: 0 0 8px; font: 600 15px/1.2 var(--body); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel h3 .help { color: var(--muted); font-weight: 400; font-size: 12px; }
.panel h3 .r { margin-left: auto; display: flex; gap: 6px; }
.grid2 { display: grid; grid-template-columns: 1.55fr 1fr; gap: 12px; }
.grid2b { display: grid; grid-template-columns: 1fr 1.25fr; gap: 12px; }
.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
.tile .l { font-size: 12px; color: var(--muted); }
.tile .v { font: 700 22px/1.2 var(--display); font-variant-numeric: tabular-nums; }
.pos { color: var(--good); } .neg { color: var(--bad); } .mut { color: var(--muted); }
.chart-wrap { position: relative; height: max(420px, calc(100vh - 290px)); }
.chart-wrap canvas { width: 100%; height: 100%; display: block; }
.tip { position: absolute; pointer-events: none; background: #0b0c0e; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; white-space: nowrap; display: none; z-index: 5; }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.legend button { border: 1px solid var(--line); background: var(--panel2); border-radius: 7px; padding: 4px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.legend button.off { opacity: .4; }
.legend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.luck { position: absolute; left: 10px; top: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; z-index: 2; }
.luck b { display: block; font-size: 13px; }
.luck.good { border-color: rgba(51,194,122,.55); background: rgba(51,194,122,.12); } .luck.good b { color: var(--good); }
.luck.bad { border-color: rgba(236,82,87,.55); background: rgba(236,82,87,.12); } .luck.bad b { color: var(--bad); }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 7px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--text); }
td { padding: 7px 8px; border-bottom: 1px solid #202328; vertical-align: middle; }
td.n, th.n { text-align: right; }
tr.click { cursor: pointer; } tr.click:hover td { background: #1b1e22; }
tr.tot td { font-weight: 700; border-top: 1px solid var(--line); }
.scroll { overflow-x: auto; }
.sub { font-size: 11px; color: var(--muted); }
.ci { font-size: 10px; color: var(--muted); margin-left: 3px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 5px; padding: 1px 7px; }
.tag.reg { color: #ff8f93; background: rgba(236, 82, 87, .13); }
.tag.fish { color: #8dbaff; background: rgba(74, 144, 255, .14); }
.tag.unknown { color: var(--muted); background: #23262b; }
.tag .man { font-weight: 400; opacity: .7; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.reg { background: var(--reg); } .dot.fish { background: var(--fish); } .dot.unknown { background: #666; }
.cards { display: inline-flex; gap: 3px; }
.card { width: 22px; height: 30px; border-radius: 4px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; font: 700 13px/1 var(--display); color: #fff; }
.card small { font-size: 10px; line-height: 1; }
.c-s { background: #5b6069; } .c-h { background: #d2393f; } .c-d { background: #2f6fd6; } .c-c { background: #2a9a52; }
.card.back { background: #2a2d33; }
.acts { display: flex; gap: 14px; font-family: var(--mono); font-size: 12px; }
.acts span.st { color: var(--muted); font: 10px var(--body); display: block; }
.acts b { font-weight: 600; color: #7fb2ff; } .acts em { font-style: normal; color: #6e737b; }
.acts sub { font-size: 8px; }
.star { background: none; border: 0; color: #555; font-size: 16px; padding: 0 4px; }
.star.on { color: var(--accent); }
.pill { font-size: 11px; font-weight: 600; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }
.pager { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 10px; color: var(--muted); font-size: 13px; }
input[type=text], input[type=number], input[type=date], select { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
input[type=number] { width: 80px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.pop { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; z-index: 30; width: 340px; box-shadow: 0 12px 40px rgba(0,0,0,.5); display: flex; flex-direction: column; gap: 12px; }
.pop h4 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.pop .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.rel { position: relative; }
.drop { border: 2px dashed #3a3f46; border-radius: 12px; padding: 34px; text-align: center; background: var(--panel); }
.drop.over { border-color: var(--accent); background: #1d1a14; }
.drop h2 { font: 700 26px var(--display); margin: 0 0 6px; }
.progress { height: 8px; background: var(--panel2); border-radius: 4px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 50; overflow: auto; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; width: min(820px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.modal pre { background: #0b0c0e; border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 12px/1.45 var(--mono); max-height: 320px; overflow: auto; white-space: pre-wrap; }
.seats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
.seat { background: var(--panel2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.seat.hero { box-shadow: inset 0 0 0 1px var(--accent); }
.street { display: grid; grid-template-columns: 70px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid #23262b; font-size: 13px; }
.street .nm { color: var(--muted); font-weight: 600; }
.lf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); gap: 12px; }
.lf h3 { font-size: 14px; }
.lf .head { display: flex; gap: 6px; margin-bottom: 8px; }
.lf .head div { flex: 1; background: var(--panel2); border-radius: 7px; text-align: center; padding: 6px 2px; }
.lf .head b { display: block; font: 700 21px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.lf .head span { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.lf td, .lf th { padding: 3px 6px; font-size: 12px; }
.c-ok { color: var(--good); } .c-agg { color: var(--bad); } .c-pas { color: var(--fish); } .c-na { color: #686c73; }
.donuts { display: flex; gap: 22px; flex-wrap: wrap; align-items: flex-start; }
.donuts .grp { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.donuts .grp > div { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 330px; }
.donut { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.note { font-size: 12px; color: var(--muted); }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
.settings .panel { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner { background: #1d1a14; border: 1px solid #4a3a1d; border-radius: 10px; padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toast { position: fixed; right: 20px; bottom: 20px; background: var(--panel2); border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; z-index: 60; }
@media (max-width: 1100px) { .grid2, .grid2b { grid-template-columns: 1fr; } .grid5 { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .rail { flex-direction: row; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; } .brand { padding: 4px 8px; font-size: 18px; } .rail .spacer, .store-state { display: none; }
  .kpis { grid-template-columns: repeat(2, 1fr); } .grid5 { grid-template-columns: repeat(2, 1fr); }
  .main { padding: 12px 16px 30px; } .chart-wrap { height: 340px; } .lf-grid { grid-template-columns: 1fr; }
}
/* replayer */
.rp-bg { position: fixed; inset: 0; background: rgba(0,0,0,.72); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 18px; }
.rp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(1320px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; overflow: auto; }
.rp-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.rp-title { font: 700 21px/1.2 var(--display); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rp-nav { display: flex; gap: 8px; align-items: center; }
.rp-body { display: grid; grid-template-columns: 1fr 320px; gap: 14px; min-height: 0; }
.rp-main { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.felt { position: relative; aspect-ratio: 16 / 9.2; width: 100%; max-height: calc(100vh - 260px); margin: 0 auto; }
.felt-in { position: absolute; inset: 9% 7%; border-radius: 999px; background: radial-gradient(ellipse at 50% 45%, #22654c 0%, #164735 55%, #0f3326 100%); border: 12px solid #2b1f15; box-shadow: inset 0 0 40px rgba(0,0,0,.55), 0 10px 30px rgba(0,0,0,.5); }
.rp-pot { position: absolute; left: 50%; top: 35%; transform: translate(-50%,-50%); font: 700 18px var(--display); color: #f3e7c8; background: rgba(0,0,0,.35); border-radius: 999px; padding: 2px 14px; white-space: nowrap; }
.rp-board { position: absolute; left: 50%; top: 49%; transform: translate(-50%,-50%); display: flex; gap: 6px; }
.rp-note { position: absolute; left: 50%; top: 61%; transform: translateX(-50%); font-size: 13px; color: #cfccc5; background: #0c0d0f; border: 1px solid var(--line); border-radius: 999px; padding: 3px 14px; white-space: nowrap; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.card.big { width: 40px; height: 56px; font-size: 20px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.card.big small { font-size: 14px; }
.card.big.back { background: repeating-linear-gradient(45deg, #3a2f6b 0 6px, #2c2454 6px 12px); border: 2px solid #ddd; }
.card.slot { background: rgba(255,255,255,.05); box-shadow: none; border: 1px dashed rgba(255,255,255,.15); }
.rp-seat { position: absolute; transform: translate(-50%,-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; width: 190px; transition: opacity .2s; }
.rp-seat.folded { opacity: .38; }
.rp-cards { display: flex; gap: 3px; margin-bottom: -14px; z-index: 1; }
.rp-box { background: #101113; border: 1px solid #353a41; border-radius: 10px; padding: 6px 10px 5px; width: 100%; text-align: center; z-index: 2; }
.rp-seat.hero .rp-box { border-color: #7a5a22; }
.rp-seat.active .rp-box { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(242,169,59,.35), 0 0 18px rgba(242,169,59,.35); }
.rp-seat.winner .rp-box { border-color: var(--good); box-shadow: 0 0 16px rgba(51,194,122,.35); }
.rp-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rp-stack { font: 700 17px var(--display); font-variant-numeric: tabular-nums; display: flex; justify-content: center; gap: 8px; align-items: center; }
.rp-eq { font: 600 12px var(--body); color: #111; background: var(--accent); border-radius: 4px; padding: 0 5px; }
.rp-act { font-size: 12px; font-weight: 700; border-radius: 6px; padding: 2px 8px; background: #2a2e34; color: #e8e5de; white-space: nowrap; }
.rp-act.a-r, .rp-act.a-b { background: #6b2f22; color: #ffd8cf; } .rp-act.a-c { background: #1f4a7a; color: #d5e6ff; } .rp-act.a-f { background: #2a2e34; color: #9aa0a8; } .rp-act.a-x { background: #2c3a2f; color: #c8e8cf; }
.rp-act.ai { background: var(--accent); color: #1a1205; } .rp-act.win { background: var(--good); color: #062014; }
.rp-bet { position: absolute; transform: translate(-50%,-50%); font: 700 14px var(--display); color: #f3e7c8; display: flex; align-items: center; gap: 5px; background: rgba(0,0,0,.4); border-radius: 999px; padding: 1px 9px 1px 3px; white-space: nowrap; }
.rp-bet i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle, #f2a93b 35%, #fff 36% 45%, #c9811f 46%); display: inline-block; }
.rp-dealer { position: absolute; transform: translate(-50%,-50%); width: 22px; height: 22px; border-radius: 50%; background: #f1ede4; color: #111; font: 700 12px/22px var(--body); text-align: center; box-shadow: 0 2px 4px rgba(0,0,0,.5); }
.rp-ctrl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
.rp-ctrl .btn { min-width: 40px; justify-content: center; }
.rp-play { min-width: 56px !important; }
#rpSlider { flex: 1; min-width: 140px; accent-color: var(--accent); }
.rp-chk { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); }
.rp-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; min-height: 0; }
.rp-res { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.rp-res > div { background: var(--panel2); border-radius: 8px; padding: 6px; text-align: center; display: flex; flex-direction: column; }
.rp-res b { font: 700 20px var(--display); font-variant-numeric: tabular-nums; }
.rp-log { flex: 1; min-height: 160px; max-height: 360px; overflow: auto; background: #0f1012; border: 1px solid var(--line); border-radius: 8px; padding: 6px; display: flex; flex-direction: column; gap: 1px; }
.rp-st { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; padding: 6px 4px 3px; display: flex; gap: 6px; align-items: center; }
.rp-line { text-align: left; border: 0; background: transparent; padding: 3px 6px; border-radius: 5px; font-size: 13px; color: var(--text); }
.rp-line.me { color: #9cc3ff; }
.rp-line.todo { opacity: .4; }
.rp-line.on { background: #2b2410; outline: 1px solid var(--accent); }
.rp-line:hover { background: #1c1f23; }
.chart-wrap canvas { cursor: pointer; }
.legend-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 8px; }
.legend-row .legend { margin-top: 0; }
.rb-ctl { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.rb-ctl input { width: 70px; }
@media (max-width: 1000px) { .rp-body { grid-template-columns: 1fr; } .rp-seat { width: 150px; } .card.big { width: 30px; height: 42px; font-size: 15px; } .felt { aspect-ratio: 4 / 3.4; } }

.fm { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: min(980px, 100%); display: flex; flex-direction: column; max-height: calc(100vh - 60px); }
.fm-tabs { display: flex; gap: 4px; padding: 14px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; align-items: center; }
.fm-tabs button { border: 1px solid transparent; background: none; border-radius: 8px; padding: 8px 14px; font-weight: 500; color: #d6d3cc; }
.fm-tabs button.on { background: var(--panel2); border-color: #4a4f56; color: var(--text); font-weight: 600; }
.fm-tabs .fm-x { margin-left: auto; color: var(--muted); }
.fm-body { padding: 14px 20px 18px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.fm-body h4 { margin: 10px 0 2px; font-size: 13px; font-weight: 600; color: #d6d3cc; }
.fm-chip { align-self: flex-start; font-size: 12px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; background: var(--panel2); }

<script>
// ===== Spin Tracker engine: Betclic parser, pots, evaluator, all-in EV =====
(function (G) {
  'use strict';
  const RANKS = '23456789TJQKA', SUITS = 'cdhs';
  function cardId(s) { return RANKS.indexOf(s[0]) * 4 + SUITS.indexOf(s[1]); }

  // ---------- Parser ----------
  const VERBS = 'Posts SB|Posts BB|Folds|Checks|Calls|Bets|Raises to|Sits out|Sits in|Reconnected|Disconnected|Posts ante';
  const RE_ACT = new RegExp('^(\\d\\d):(\\d\\d):(\\d\\d) - (.+): (' + VERBS + ')(?: (\\d+))?( and is all-in)?\\s*$');
  const RE_SEAT = /^Seat (\d+): (.+) \((\d+)\) \[([^\]]*)\]\s*$/;
  const RE_HOLE = /^(.+): \[(\w\w) (\w\w)\]\s*$/;
  const RE_WIN = /^(.+) wins (?:main pot|\d+\w\w side pot) of (\d+)\s*$/;
  const RE_FIN = /^(.+) finished (\d+)\w\w(?: and wins ([\d.,]+) EUR)?\s*$/;
  const RE_SHOW = /^(.+) shows \[(\w\w) (\w\w)\]/;
  const STREETS = { 'PRE-FLOP': 0, 'FLOP': 1, 'TURN': 2, 'RIVER': 3, 'SHOWDOWN': 4, 'SUMMARY': 5, 'HEADER': -3, 'PLAYERS': -2, 'HOLE CARDS': -1 };
  const num = (s) => parseFloat(String(s).replace(',', '.').replace(/[^\d.\-]/g, '')) || 0;

  function parseHand(block) {
    const lines = block.split(/\r?\n/);
    const h = { players: [], acts: [], board: [], hole: {}, won: {}, fin: [], shown: {} };
    let sec = null;
    for (let raw of lines) {
      const line = raw.replace(/\s+$/, '');
      if (!line) continue;
      const m0 = /^\*\*\* ([A-Z\- ]+) \*\*\*(?: \[([^\]]*)\])?/.exec(line);
      if (m0) {
        sec = STREETS[m0[1]] !== undefined ? STREETS[m0[1]] : sec;
        if (m0[2] && (sec === 1 || sec === 2 || sec === 3)) h.board = m0[2].trim().split(/\s+/);
        continue;
      }
      if (sec === -3) {
        const i = line.indexOf(': ');
        if (i < 0) continue;
        const k = line.slice(0, i), v = line.slice(i + 2);
        switch (k) {
          case 'Site': h.site = v; break;
          case 'Game Mode': h.mode = v; break;
          case 'Game Name': h.gname = v; break;
          case 'Game ID': h.gid = v; break;
          case 'Prize pool': h.prize = num(v); break;
          case 'Multiplier': h.mult = num(v); break;
          case 'Buy In': h.bi = num(v); break;
          case 'Hand ID': h.id = v; break;
          case 'Date & Time': {
            const m = /(\d{4})-(\d\d)-(\d\d) (\d\d):(\d\d):(\d\d)/.exec(v);
            if (m) h.ts = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4], +m[5], +m[6]);
            break;
          }
          case 'Table ID': h.tid = v; break;
          case 'Blinds': { const p = v.split('/'); h.sb = num(p[0]); h.bb = num(p[1]); break; }
          case 'Total Pot': h.pot = num(v); break;
          case 'Rake': h.rake = num(v); break;
        }
      } else if (sec === -2) {
        const m = RE_SEAT.exec(line);
        if (m) {
          const tags = m[4].split(/\s+/);
          h.players.push({ seat: +m[1], name: m[2], stack: +m[3], btn: tags.includes('BTN'), sbp: tags.includes('SB'), bbp: tags.includes('BB'), hero: tags.includes('Hero') });
        }
      } else if (sec === -1) {
        const m = RE_HOLE.exec(line);
        if (m) h.hole[m[1]] = [m[2], m[3]];
      } else if (sec >= 0 && sec <= 3) {
        const m = RE_ACT.exec(line);
        if (m) {
          const v = m[5];
          let a = null;
          if (v === 'Posts SB') a = 'sb'; else if (v === 'Posts BB') a = 'bb'; else if (v === 'Posts ante') a = 'ante';
          else if (v === 'Folds') a = 'f'; else if (v === 'Checks') a = 'x'; else if (v === 'Calls') a = 'c';
          else if (v === 'Bets') a = 'b'; else if (v === 'Raises to') a = 'r';
          if (a) h.acts.push({ st: sec, p: m[4], a, n: m[6] ? +m[6] : 0, ai: !!m[7] });
        }
      } else if (sec === 4) {
        const m = RE_SHOW.exec(line);
        if (m) h.shown[m[1]] = [m[2], m[3]];
      } else if (sec === 5) {
        let m = RE_WIN.exec(line);
        if (m) { h.won[m[1]] = (h.won[m[1]] || 0) + (+m[2]); continue; }
        m = RE_FIN.exec(line);
        if (m) h.fin.push({ p: m[1], place: +m[2], eur: m[3] ? num(m[3]) : 0 });
      }
    }
    if (!h.id || !h.players.length) return null;
    for (const k in h.shown) if (!h.hole[k]) h.hole[k] = h.shown[k];
    finalize(h);
    return h;
  }

  function finalize(h) {
    const n = h.players.length; h.n = n;
    const hero = h.players.find(p => p.hero); h.hero = hero ? hero.name : null;
    for (const p of h.players) {
      if (n === 2) p.pos = p.btn ? 'SB' : 'BB';
      else p.pos = p.btn ? 'BTN' : p.sbp ? 'SB' : p.bbp ? 'BB' : '?';
    }
    // contributions, per-street commitments
    const contrib = {}, folded = {}, committed = {};
    let st = -1;
    for (const p of h.players) { contrib[p.name] = 0; folded[p.name] = false; }
    for (const a of h.acts) {
      if (a.st !== st) { st = a.st; for (const k in committed) committed[k] = 0; }
      if (!(a.p in committed)) committed[a.p] = 0;
      let add = 0;
      if (a.a === 'sb' || a.a === 'bb' || a.a === 'c' || a.a === 'b' || a.a === 'ante') add = a.n;
      else if (a.a === 'r') add = a.n - committed[a.p];
      else if (a.a === 'f') folded[a.p] = true;
      if (a.a !== 'ante') committed[a.p] += add;
      contrib[a.p] = (contrib[a.p] || 0) + add;
      a.add = add;
    }
    // uncalled excess (not written in Betclic HH) is returned to the top contributor
    // (Betclic's "Total Pot" excludes it when the bet was partially called by an all-in player)
    const order = Object.keys(contrib).sort((a, b) => contrib[b] - contrib[a]);
    const totC = Object.values(contrib).reduce((x, y) => x + y, 0);
    const wonTot = Object.values(h.won).reduce((x, y) => x + y, 0);
    if (h.pot == null && wonTot > 0) h.pot = wonTot;
    if (h.pot != null && totC > h.pot && order.length) { h.uncalled = totC - h.pot; h.uncalledTo = order[0]; contrib[order[0]] -= h.uncalled; }
    h.contrib = contrib; h.folded = folded;
    h.net = {};
    for (const p of h.players) h.net[p.name] = (h.won[p.name] || 0) - contrib[p.name];
    h.sd = h.players.filter(p => !folded[p.name]).length >= 2 && Object.keys(h.shown).length >= 2;
  }

  function parseFile(text) {
    const out = [];
    const blocks = text.split(/\r?\n-{6,}\s*\r?\n/);
    for (const b of blocks) {
      if (b.indexOf('*** HEADER ***') < 0) continue;
      try { const h = parseHand(b.slice(b.indexOf('*** HEADER ***'))); if (h) { h.raw = b.trim(); out.push(h); } } catch (e) { /* skip */ }
    }
    return out;
  }

  // ---------- Evaluator (7 cards -> comparable int) ----------
  const bitCount = (x) => { let c = 0; while (x) { x &= x - 1; c++; } return c; };
  function topBits(mask, k) { let r = 0, c = 0; for (let i = 12; i >= 0 && c < k; i--) if (mask & (1 << i)) { r = (r << 4) | i; c++; } while (c < k) { r <<= 4; c++; } return r; }
  function straightHigh(mask) {
    const m = mask;
    for (let hi = 12; hi >= 4; hi--) { const need = 0x1f << (hi - 4); if ((m & need) === need) return hi; }
    if ((m & 0x100f) === 0x100f) return 3; // wheel A-2-3-4-5
    return -1;
  }
  const cnt = new Int32Array(13), sc = new Int32Array(4), sm = new Int32Array(4);
  function eval7(cards, len) {
    cnt.fill(0); sc.fill(0); sm.fill(0);
    let mask = 0;
    for (let i = 0; i < len; i++) { const c = cards[i], r = c >> 2, s = c & 3; cnt[r]++; sc[s]++; sm[s] |= 1 << r; mask |= 1 << r; }
    for (let s = 0; s < 4; s++) if (sc[s] >= 5) {
      const sh = straightHigh(sm[s]);
      if (sh >= 0) return (8 << 20) | sh;
      return (5 << 20) | topBits(sm[s], 5);
    }
    let quad = -1, trips = -1, trips2 = -1, p1 = -1, p2 = -1;
    for (let r = 12; r >= 0; r--) {
      const c = cnt[r];
      if (c === 4) quad = r;
      else if (c === 3) { if (trips < 0) trips = r; else if (trips2 < 0) trips2 = r; }
      else if (c === 2) { if (p1 < 0) p1 = r; else if (p2 < 0) p2 = r; }
    }
    if (quad >= 0) return (7 << 20) | (quad << 4) | topBits(mask & ~(1 << quad), 1);
    if (trips >= 0 && (trips2 >= 0 || p1 >= 0)) { const pr = Math.max(trips2, p1); return (6 << 20) | (trips << 4) | pr; }
    const sh = straightHigh(mask);
    if (sh >= 0) return (4 << 20) | sh;
    if (trips >= 0) return (3 << 20) | (trips << 8) | topBits(mask & ~(1 << trips), 2);
    if (p1 >= 0 && p2 >= 0) return (2 << 20) | (p1 << 8) | (p2 << 4) | topBits(mask & ~(1 << p1) & ~(1 << p2), 1);
    if (p1 >= 0) return (1 << 20) | (p1 << 12) | topBits(mask & ~(1 << p1), 3);
    return topBits(mask, 5);
  }

  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- Pots ----------
  function buildPots(h) {
    const live = h.players.map(p => p.name).filter(n => !h.folded[n]);
    const levels = [...new Set(live.map(n => h.contrib[n]))].sort((a, b) => a - b);
    const pots = []; let prev = 0;
    for (const L of levels) {
      let amt = 0;
      for (const p of h.players) { const c = h.contrib[p.name]; amt += Math.max(0, Math.min(c, L) - Math.min(c, prev)); }
      const elig = live.filter(n => h.contrib[n] >= L);
      if (amt > 0) pots.push({ amt, elig });
      prev = L;
    }
    // dead money above highest live level (shouldn't happen) goes to last pot
    let rest = 0; for (const p of h.players) rest += Math.max(0, h.contrib[p.name] - prev);
    if (rest && pots.length) pots[pots.length - 1].amt += rest;
    return pots;
  }

  // ---------- All-in EV ----------
  // returns { adj:bool, ev:{name:netEV}, vr:{name:variance}, eq:{name:equity of total}, st }
  function computeEV(h, trials) {
    trials = trials || 12000;
    const res = { adj: false, ev: Object.assign({}, h.net), vr: {}, st: -1 };
    const live = h.players.map(p => p.name).filter(n => !h.folded[n]);
    if (live.length < 2) return res;
    let S = 0; for (const a of h.acts) if (a.st > S) S = a.st;
    const boardKnown = S === 0 ? 0 : S + 2;
    if (boardKnown >= 5) return res;
    for (const n of live) if (!h.hole[n]) return res;
    const stackOf = {}; for (const p of h.players) stackOf[p.name] = p.stack;
    const notAllIn = live.filter(n => h.contrib[n] < stackOf[n]);
    if (notAllIn.length > 1) return res;
    const pots = buildPots(h);
    const board = h.board.slice(0, boardKnown).map(cardId);
    const holes = live.map(n => h.hole[n].map(cardId));
    const dead = new Set(board); holes.forEach(x => x.forEach(c => dead.add(c)));
    // include any other known hole cards as dead
    for (const k in h.hole) if (!live.includes(k)) h.hole[k].forEach(c => dead.add(cardId(c)));
    const deck = []; for (let c = 0; c < 52; c++) if (!dead.has(c)) deck.push(c);
    const need = 5 - boardKnown;
    const L = live.length, sum = new Float64Array(L), sum2 = new Float64Array(L);
    const cards = new Int32Array(7), full = new Int32Array(5), score = new Int32Array(L), take = new Float64Array(L);
    const potElig = pots.map(p => p.elig.map(n => live.indexOf(n)));
    function settle() {
      for (let i = 0; i < L; i++) {
        cards[0] = holes[i][0]; cards[1] = holes[i][1];
        for (let j = 0; j < 5; j++) cards[2 + j] = full[j];
        score[i] = eval7(cards, 7);
      }
      take.fill(0);
      for (let k = 0; k < pots.length; k++) {
        const el = potElig[k]; let best = -1, nb = 0;
        for (const i of el) { if (score[i] > best) { best = score[i]; nb = 1; } else if (score[i] === best) nb++; }
        const share = pots[k].amt / nb;
        for (const i of el) if (score[i] === best) take[i] += share;
      }
      for (let i = 0; i < L; i++) { sum[i] += take[i]; sum2[i] += take[i] * take[i]; }
    }
    for (let j = 0; j < boardKnown; j++) full[j] = board[j];
    let N = 0;
    if (need <= 2) {
      if (need === 1) { for (let a = 0; a < deck.length; a++) { full[4] = deck[a]; settle(); N++; } }
      else { for (let a = 0; a < deck.length; a++) for (let b = a + 1; b < deck.length; b++) { full[3] = deck[a]; full[4] = deck[b]; settle(); N++; } }
    } else {
      const rnd = mulberry32(hashStr(h.id)); const d = deck.slice(); const D = d.length;
      for (let t = 0; t < trials; t++) {
        for (let j = 0; j < need; j++) { const k = j + Math.floor(rnd() * (D - j)); const tmp = d[j]; d[j] = d[k]; d[k] = tmp; full[boardKnown + j] = d[j]; }
        settle(); N++;
      }
    }
    res.adj = true; res.st = S; res.eq = {};
    const totalPot = pots.reduce((s, p) => s + p.amt, 0);
    live.forEach((n, i) => {
      const m = sum[i] / N;
      res.ev[n] = m - h.contrib[n];
      res.vr[n] = Math.max(0, sum2[i] / N - m * m);
      res.eq[n] = totalPot ? m / totalPot : 0;
    });
    return res;
  }

  // ---------- Preflop analysis helpers ----------
  // Per player preflop decisions with situation key
  function preflopInfo(h) {
    const info = {}; // name -> {vpip, pfr, limp, decisions:[{key, act}] , btnFirstIn, btnLimp}
    for (const p of h.players) info[p.name] = { vpip: false, pfr: false, decisions: [], btnOpp: false, btnLimp: false, threeBet: false, threeBetOpp: false };
    const posOf = {}; for (const p of h.players) posOf[p.name] = p.pos;
    const stackOf = {}; for (const p of h.players) stackOf[p.name] = p.stack;
    const bbAllInPost = h.acts.some(a => a.st === 0 && a.a === 'bb' && a.ai);
    let raises = 0, curBet = 0; const committed = {}; const seq = [];
    for (const a of h.acts) {
      if (a.st !== 0) break;
      if (a.a === 'sb' || a.a === 'bb' || a.a === 'ante') { if (a.a !== 'ante') { committed[a.p] = (committed[a.p] || 0) + a.n; curBet = Math.max(curBet, committed[a.p]); } continue; }
      const I = info[a.p]; if (!I) continue;
      const pos = posOf[a.p];
      const label = h.n === 2 ? 'HU ' + pos : pos;
      // classify action
      let act;
      const allin = a.ai || ((committed[a.p] || 0) + a.add >= stackOf[a.p]);
      if (a.a === 'f') act = 'fold';
      else if (a.a === 'x') act = 'check';
      else if (a.a === 'c') act = raises === 0 ? 'limp' : 'call';
      else if (a.a === 'r' || a.a === 'b') act = allin ? 'shove' : 'raise';
      else act = a.a;
      if (a.a === 'c' && allin && raises === 0) act = 'limp';
      // situation key (actions faced, by others and self, before this decision)
      const key = label + ' | ' + (seq.length ? seq.join(', ') : 'premier à parler');
      const effBB = effStackBB(h, a.p);
      I.decisions.push({ key, act, eff: effBB, first: !I.decisions.length });
      // stats
      if (act === 'limp' || act === 'call' || act === 'raise' || act === 'shove') I.vpip = true;
      if (act === 'raise' || act === 'shove') I.pfr = true;
      if (h.n === 3 && pos === 'BTN' && I.decisions.length === 1 && !bbAllInPost) { I.btnOpp = true; if (act === 'limp') I.btnLimp = true; }
      if (raises === 1 && I.decisions.length === 1) { I.threeBetOpp = true; if (act === 'raise' || act === 'shove') I.threeBet = true; }
      // update sequence
      const shortPos = h.n === 2 ? pos : pos;
      seq.push(shortPos + ' ' + act);
      if (a.a === 'r' || a.a === 'b') raises++;
      committed[a.p] = (committed[a.p] || 0) + a.add;
      curBet = Math.max(curBet, committed[a.p]);
    }
    return info;
  }

  function effStackBB(h, name) {
    const me = h.players.find(p => p.name === name); if (!me || !h.bb) return 0;
    let mx = 0; for (const p of h.players) if (p.name !== name) mx = Math.max(mx, p.stack);
    return Math.min(me.stack, mx) / h.bb;
  }

      '<label class="f" style="flex-direction:row;align-items:center" for="lfRef">Comparer à <select id="lfRef"><option value="reg"' + (u.ref === 'reg' ? ' selected' : '') + '>Regs de ta base</option><option value="fish"' + (u.ref === 'fish' ? ' selected' : '') + '>Fish de ta base</option><option value="none"' + (u.ref === 'none' ? ' selected' : '') + '>Rien</option></select></label>' : '') +
    '<div class="grow"></div>' + filterBar() + '</div>';
  if (u.prof === 'player' && !u.who && opps.length) u.who = opps[0].name;
  const P = lfProfileHands();
  if (u.sub === 'stats') return h + lfStats(P);
  const M = lfAggregate(P.hs, P.pick, u.pos);
  const R = u.ref !== 'none' ? lfAggregate(S.hands, (x) => x.opps.filter(o => tagOf(o) === u.ref), u.pos) : null;
  const list = [...M.values()].filter(r => r.n >= 5).sort((a, b) => b.n - a.n).slice(0, 30);
  if (!list.length) return h + '<div class="panel empty">Pas assez de mains pour ce profil.</div>';
  h += '<p class="note" style="margin:0">Chaque carte = une situation préflop (ta position et les actions avant ta décision), découpée par stack effectif en big blinds. ' + (R ? 'Couleurs vs ' + (u.ref === 'reg' ? 'les regs' : 'les fish') + ' de ta base, dans la même case : <span class="c-ok">vert</span> écart ≤ 5 pts, <span class="c-agg">rouge</span> plus agressif, <span class="c-pas">bleu</span> plus passif, gris = référence trop petite (survole une case pour voir la référence).' : '') + '</p><div class="lf-grid">' + list.map(r => lfCard(r, R && R.get(r.key))).join('') + '</div>';
  return h;
}
function lfCard(r, ref) {
  const acts = ['fold', 'check', 'limp', 'call', 'raise', 'shove'].filter(a => r.a[a] || (ref && ref.a[a]));
  const [pos, seq] = r.key.split(' | ');
  const cell = (bk, rb, a) => {
    if (!bk.n) return '<td class="n c-na">—</td>';
    const v = (bk.a[a] || 0) / bk.n * 100;
    if (!rb || rb.n < 8) return '<td class="n c-na" title="Référence insuffisante">' + Math.round(v) + '<span class="sub">%</span></td>';
    const rv = (rb.a[a] || 0) / rb.n * 100, d = v - rv;
    const c = Math.abs(d) <= 5 ? 'c-ok' : ((AGG[a] ? d > 0 : d < 0) ? 'c-agg' : 'c-pas');
    return '<td class="n ' + c + '" title="Réf. ' + Math.round(rv) + ' % sur ' + rb.n + ' mains">' + Math.round(v) + '<span class="sub">%</span></td>';
  };
  let h = '<div class="panel lf"><h3><span class="pill">' + esc(pos) + '</span> ' + esc(seq === 'premier à parler' ? 'Premier à parler' : 'après ' + seq) + '</h3>';
  h += '<div class="head"><div><b>' + fmtN(r.n) + '</b><span>Mains</span></div>' + acts.map(a => '<div><b>' + Math.round((r.a[a] || 0) / r.n * 100) + '%</b><span>' + ACT_LABEL[a] + '</span>' + (ref && ref.n ? '<span class="sub" style="display:block;text-transform:none;letter-spacing:0">réf. ' + Math.round((ref.a[a] || 0) / ref.n * 100) + ' %</span>' : '') + '</div>').join('') + '</div>';
  h += '<table><thead><tr><th>Stack (bb)</th><th class="n">Mains</th>' + acts.map(a => '<th class="n">' + ACT_LABEL[a] + '</th>').join('') + '</tr></thead><tbody>';
  for (let i = BUCKETS.length - 1; i >= 0; i--) { const bk = r.b[i]; if (!bk.n && !(ref && ref.b[i].n)) continue; h += '<tr><td>' + bucketName(i) + '</td><td class="n">' + bk.n + '</td>' + acts.map(a => cell(bk, ref && ref.b[i], a)).join('') + '</tr>'; }
  return h + '</tbody></table></div>';
}
function lfStats(P) {
  const rows = ['BTN', 'SB', 'BB', 'HU SB', 'HU BB', 'Total'];
  const acc = {}; for (const r of rows) acc[r] = { n: 0, vpip: 0, pfr: 0, tbo: 0, tb: 0, cbo: 0, cb: 0, fco: 0, fc: 0, sf: 0, wtsd: 0, wsd: 0, ab: 0, ac: 0, ev: 0, limpo: 0, limp: 0 };
  for (const h of P.hs) for (const name of P.pick(h)) {
    const p = h.players.find(z => z.name === name); if (!p) continue; const I = h.pf[name]; const po = E.postflopInfo(h, name);
    const k = h.n === 2 ? 'HU ' + p.pos : p.pos;
    for (const r of [acc[k], acc.Total]) { if (!r) continue; r.n++; if (I.vpip) r.vpip++; if (I.pfr) r.pfr++; if (I.threeBetOpp) r.tbo++; if (I.threeBet) r.tb++; if (I.btnOpp) r.limpo++; if (I.btnLimp) r.limp++; if (po.cbOpp) r.cbo++; if (po.cb) r.cb++; if (po.fcbOpp) r.fco++; if (po.fcb) r.fc++; if (po.sawFlop) r.sf++; if (po.wtsd && po.sawFlop) r.wtsd++; if (po.wsd && po.sawFlop) r.wsd++; r.ab += po.af_b; r.ac += po.af_c; r.ev += EVc(h, name); }
  }
  const pc = (a, b) => b ? fmtP(a / b * 100) : '—';
  return '<div class="panel" style="padding:0"><div class="scroll"><table><thead><tr><th>' + esc(P.label) + '</th><th class="n">Mains</th><th class="n">VPIP</th><th class="n">PFR</th><th class="n">Limp BTN</th><th class="n">3-bet</th><th class="n">C-bet flop</th><th class="n">Fold vs c-bet</th><th class="n">WTSD</th><th class="n">W$SD</th><th class="n">AF</th><th class="n">cEV / main</th></tr></thead><tbody>' +
    rows.map(k => { const r = acc[k]; return '<tr' + (k === 'Total' ? ' class="tot"' : '') + '><td>' + k + '</td><td class="n">' + fmtN(r.n) + '</td><td class="n">' + pc(r.vpip, r.n) + '</td><td class="n">' + pc(r.pfr, r.n) + '</td><td class="n">' + pc(r.limp, r.limpo) + '</td><td class="n">' + pc(r.tb, r.tbo) + '</td><td class="n">' + pc(r.cb, r.cbo) + '</td><td class="n">' + pc(r.fc, r.fco) + '</td><td class="n">' + pc(r.wtsd, r.sf) + '</td><td class="n">' + pc(r.wsd, r.wtsd) + '</td><td class="n">' + (r.ac ? fmtN(r.ab / r.ac, 1) : '—') + '</td><td class="n ' + cls(r.ev) + '">' + fmtS(r.n ? r.ev / r.n : NaN, 1) + '</td></tr>'; }).join('') +
    '</tbody></table></div></div><p class="note">WTSD et W$SD sont calculés sur les mains où le joueur a vu le flop. AF = (bets + raises) / calls après le flop.</p>';
}

const KV = {
  get(k) { return new Promise(res => { try { const q = IDB.db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); } catch (e) { res(undefined); } }); },
  set(k, v) { return new Promise(res => { try { const tx = IDB.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); } catch (e) { res(false); } }); }
};
const fsaOk = () => 'showDirectoryPicker' in window;
async function walkDir(dir, prefix, out) {
  for await (const [name, h] of dir.entries()) {
    if (h.kind === 'file') { if (/\.txt$/i.test(name)) { try { const f = await h.getFile(); f._path = prefix + name; out.push(f); } catch (e) { } } }
    else if (h.kind === 'directory') await walkDir(h, prefix + name + '/', out);
  }
}
async function pickDir() {
  if (!fsaOk()) { location.hash = 'imports'; toast('Ce navigateur ne sait pas relier un dossier : utilise Chrome ou Edge, ou importe tes fichiers à la main.'); return; }
  let h; try { h = await window.showDirectoryPicker({ id: 'betclic-hh', mode: 'read' }); } catch (e) { return; }
  FSA.handle = h; FSA.name = h.name; FSA.perm = 'granted'; FSA.last = 0;
  if (S.storage === 'idb') await KV.set('dir', h);
  renderSync(); if (currentView() === 'imports') render();
  await syncDir(true);
}
async function syncDir(gesture, quiet) {
  if (!FSA.handle) { if (gesture) return pickDir(); return; }
  if (FSA.busy) return;
  let p = 'denied';
  try { p = await FSA.handle.queryPermission({ mode: 'read' }); if (p !== 'granted' && gesture) p = await FSA.handle.requestPermission({ mode: 'read' }); } catch (e) { }
  FSA.perm = p; renderSync();
  if (p !== 'granted') { if (gesture) toast('Accès au dossier refusé'); return; }
  FSA.busy = true; renderSync();
  try {
    const files = []; await walkDir(FSA.handle, FSA.handle.name + '/', files);
    await importFiles(files, true, quiet);
    FSA.last = Date.now(); LS.set('st_last_sync', String(FSA.last));
  } catch (e) { if (!quiet) toast('Lecture du dossier impossible : ' + (e.message || e)); }
  FSA.busy = false; renderSync(); if (currentView() === 'imports') render();
}
function renderSync() {
  const b = $('#syncBtn'), s = $('#syncState'); if (!b) return;
  if (!fsaOk()) { b.textContent = 'Importer des mains'; s.textContent = ''; return; }
  b.disabled = FSA.busy;
  b.textContent = FSA.busy ? 'Mise à jour…' : FSA.handle ? '⟳ Mettre à jour' : 'Relier mon dossier';
  s.textContent = FSA.handle ? FSA.name + (FSA.perm !== 'granted' ? ' · clique pour autoriser' : FSA.last ? ' · ' + ago(FSA.last) : '') : 'Aucun dossier relié';
}
function folderPanel() {
  if (!fsaOk()) return '<div class="banner">Ce navigateur ne permet pas de relier un dossier. Avec Chrome ou Edge, l\'appli relit ton dossier d\'historiques toute seule. En attendant, importe tes fichiers ci-dessous.</div>';
  if (!FSA.handle) return '<div class="panel"><h3>Dossier d\'historiques</h3><p class="note" style="font-size:13px">Range tous tes exports Betclic (fichiers ExportHH_….txt) dans un même dossier, puis relie-le une seule fois. Ensuite, « Mettre à jour » importe les nouveaux fichiers.</p><div class="row"><button class="btn primary" data-pickdir="1">Relier mon dossier d\'historiques</button></div></div>';
  return '<div class="panel"><h3>Dossier d\'historiques relié</h3><p style="margin:0 0 8px"><b>' + esc(FSA.name) + '</b>' + (FSA.last ? ' · dernière mise à jour ' + ago(FSA.last) : '') + (FSA.perm !== 'granted' ? ' · <span style="color:var(--accent)">autorisation à redonner</span>' : '') + '</p><div class="row"><button class="btn primary" data-sync="1"' + (FSA.busy ? ' disabled' : '') + '>⟳ Mettre à jour maintenant</button><button class="btn" data-pickdir="1">Changer de dossier</button></div><p class="note">Pendant que l\'appli est ouverte, le dossier est relu toutes les 3 minutes. À la réouverture, Chrome peut redemander l\'autorisation : clique alors sur « Mettre à jour ».</p></div>';
}
function exportPrefs() {
  try {
    const blob = new Blob([JSON.stringify(S.prefs, null, 1)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'spin-tracker-reglages.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  } catch (e) { toast('Export impossible'); }
}
async function importPrefs(file) {
  if (!file) return;
  try { const p = JSON.parse(await file.text()); S.prefs = migrate(Object.assign(defaultPrefs(), p)); S.prefs.cls = Object.assign(defaultPrefs().cls, p.cls || {}); savePrefs(); refresh(); toast('Réglages restaurés'); }
  catch (e) { toast('Ce fichier n\'est pas une sauvegarde de réglages'); }
}
async function pwaInit() {
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) { }
  FSA.last = +(LS.get('st_last_sync') || 0);
  if (S.storage === 'idb' && fsaOk()) {
    const h = await KV.get('dir');
    if (h) { FSA.handle = h; FSA.name = h.name; try { FSA.perm = await h.queryPermission({ mode: 'read' }); } catch (e) { } }
  }
  renderSync(); if (currentView() === 'imports') render();
  if (FSA.perm === 'granted') syncDir(false, true);
  setInterval(() => { if (FSA.handle && FSA.perm === 'granted' && !document.hidden) syncDir(false, true); }, 180000);
  setInterval(renderSync, 60000);
}

// ---------- boot ----------
(async function boot() {
  loadPrefs();
  $('#main').innerHTML = '<div class="panel empty">Chargement de tes mains…</div>';
  const ok = await IDB.open(); S.storage = ok ? 'idb' : 'memory';
  let stored = ok ? await IDB.all() : [];
  if (stored.length) addHands(stored.map(o => { try { return E.unpack(o); } catch (e) { return null; } }).filter(Boolean));
  recompute();
  if (!S.hands.length && !location.hash) location.hash = 'imports';
  render();
  pwaInit();
})();
</script>
